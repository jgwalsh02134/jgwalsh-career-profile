<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secure Notes – J. Gregory Walsh</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; }
    .note-preview code { background-color: #f3f4f6; padding: 2px 4px; border-radius: 4px; font-family: monospace; }
    .note-preview table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    .note-preview th, .note-preview td { border: 1px solid #d1d5db; padding: 0.5rem; }
    .note-preview th { background-color: #f3f4f6; text-align: left; }
    .collapsible { cursor: pointer; }
  </style>
</head>
<body class="text-slate-800">
  <div class="max-w-3xl mx-auto px-6 py-10">
    <header class="mb-8">
      <h1 class="text-3xl font-semibold text-slate-900">Secure Notes</h1>
      <p class="text-sm text-slate-600">Access granted to <code id="userEmail">...</code></p>
    </header>

    <main>
      <section class="bg-white border border-slate-200 rounded-lg p-6 shadow-sm mb-8">
        <h2 class="text-lg font-semibold mb-4">New Note</h2>
        <input id="noteTitle" type="text" placeholder="Title" class="w-full border border-slate-300 rounded p-2 mb-2" />
        <textarea id="noteBody" placeholder="Body..." class="w-full border border-slate-300 rounded p-2 mb-2 h-32"></textarea>
        <div class="mb-2">
          <button onclick="togglePreview()" class="text-sm text-blue-600 hover:underline">↕ Show Preview</button>
        </div>
        <div id="preview" class="note-preview prose prose-slate hidden border p-3 bg-slate-50 rounded"></div>
        <button onclick="saveNote()" class="bg-slate-800 text-white px-4 py-2 rounded">Save Note</button>
        <p class="text-xs text-slate-500 mt-2">Notes are saved to secure Cloudflare KV storage. Session required.</p>
      </section>

      <input type="text" id="searchInput" placeholder="Search notes..." class="mb-4 w-full border border-slate-300 rounded p-2" oninput="filterNotes()" />

      <section id="notesContainer" class="space-y-4"></section>

      <section class="text-sm text-slate-600 border-t pt-6 mt-8">
        <a href="/private/index.html" class="text-blue-700 hover:underline font-medium">← Return to dashboard</a>
      </section>
    </main>
  </div>

  <script>
    const endpoint = 'https://notes-worker.jgregorywalsh.workers.dev';

    function parseJwtPayload(jwt) {
      try {
        const payload = jwt.split('.')[1];
        const decodedPayload = atob(payload.replace(/-/g, '+').replace(/_/g, '/'));
        return JSON.parse(decodedPayload);
      } catch { return null; }
    }

    function setUser() {
      const jwt = document.cookie.split('; ').find(row => row.startsWith('CF_Authorization='))?.split('=')[1];
      if (!jwt) return;
      const payload = parseJwtPayload(jwt);
      document.getElementById('userEmail').textContent = payload?.email || 'Authenticated user';
    }

    function togglePreview() {
      const body = document.getElementById('noteBody').value;
      const preview = document.getElementById('preview');
      preview.innerHTML = marked.parse(body);
      preview.classList.toggle('hidden');
    }

    async function saveNote() {
      const title = document.getElementById('noteTitle').value;
      const body = document.getElementById('noteBody').value;
      if (!title || !body) return alert("Both fields required.");

      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, body })
      });

      if (res.ok) {
        document.getElementById('noteTitle').value = '';
        document.getElementById('noteBody').value = '';
        loadNotes();
      } else {
        alert("Error saving note.");
      }
    }

    async function loadNotes() {
      const container = document.getElementById('notesContainer');
      container.innerHTML = '<p class="text-slate-500 text-sm">Loading…</p>';
      try {
        const res = await fetch(endpoint);
        const json = await res.json();
        if (!Array.isArray(json.notes)) throw new Error();

        window.allNotes = json.notes;
        displayNotes(json.notes);
      } catch {
        container.innerHTML = '<p class="text-red-600 text-sm">Error loading notes.</p>';
      }
    }

    function displayNotes(notes) {
      const container = document.getElementById('notesContainer');
      container.innerHTML = '';

      notes.forEach(({ title, body, timestamp, id }) => {
        const note = document.createElement('div');
        note.className = "bg-white border border-slate-200 rounded p-4 shadow-sm";
        const dateStr = new Date(timestamp).toLocaleString('en-US', { dateStyle: 'full', timeStyle: 'short' });

        note.innerHTML = `
          <h3 class="font-semibold text-slate-900">${title}</h3>
          <div class="text-slate-600 text-sm mb-2">${dateStr}</div>
          <div class="prose prose-sm prose-slate">${marked.parse(body)}</div>
          <div class="mt-3 flex gap-4">
            <button onclick="deleteNote('${id}')" class="text-red-600 text-xs font-medium hover:underline">Delete</button>
            <button onclick="duplicateNote('${title.replace(/'/g, "&#39;")}',
