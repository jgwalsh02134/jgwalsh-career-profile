<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Resource Center & Downloads — jgwalsh.com</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Tailwind CDN is acceptable here; if CSP blocks it, keep the markup and continue (functionality remains). -->
  <script src="https://cdn.tailwindcss.com" defer></script>
  <script src="/src/resources.js" type="module" defer></script>
</head>
<body class="bg-slate-50 text-slate-900">
  <main class="mx-auto max-w-6xl p-6">
    <header class="mb-6">
      <h1 class="text-2xl font-semibold">Resource Center & Downloads</h1>
      <p class="text-sm text-slate-600">Search, filter, and download files.</p>
    </header>

    <!-- Controls -->
    <form id="controls" class="flex flex-wrap gap-3 mb-4" onsubmit="return false;">
      <input id="q" class="border rounded px-3 py-2 flex-1 min-w-[260px]" placeholder="Search titles, descriptions, tags…" autocomplete="off" />
      <select id="sort" class="border rounded px-3 py-2">
        <option value="recent">Newest</option>
        <option value="title">A → Z</option>
        <option value="size">Size</option>
      </select>
      <button id="downloadSelected" type="button" class="px-3 py-2 border rounded disabled:opacity-50" disabled>Download selected</button>
      <span id="status" class="sr-only" aria-live="polite" role="status"></span>
    </form>

    <!-- Dynamic tag chips -->
    <div id="chips" class="flex flex-wrap gap-2 mb-4"></div>

    <!-- Results grid -->
    <section id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4" aria-live="polite"></section>

    <!-- Empty states -->
    <template id="empty-all">
      <div class="p-6 border rounded bg-white text-slate-600">No resources yet. Add items to <code>/assets/resources.json</code>.</div>
    </template>
    <template id="empty-filter">
      <div class="p-6 border rounded bg-white text-slate-600">No matches. Try clearing search or tags.</div>
    </template>
  </main>
</body>
</html>
