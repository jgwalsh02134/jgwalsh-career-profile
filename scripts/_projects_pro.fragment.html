<section class="projects-pro" aria-label="Projects">
  <header class="pp-header">
    <div class="pp-title">
      <h1 class="pp-h1">Projects</h1>
      <p class="pp-sub">Interactive analyses, tools, and experiments.</p>
    </div>
    <div class="pp-actions" role="region" aria-label="Project controls">
      <input id="pp-search" class="pp-input" type="search" placeholder="Search projects (press /)" aria-label="Search projects" />
      <select id="pp-sort" class="pp-select" aria-label="Sort projects">
        <option value="newest">Newest</option>
        <option value="az">A → Z</option>
      </select>
      <div class="pp-view" role="group" aria-label="View mode">
        <button id="pp-view-grid" class="pp-btn is-active" data-view="grid" title="Grid view (g)" aria-pressed="true">Grid</button>
        <button id="pp-view-list" class="pp-btn" data-view="list" title="List view (l)" aria-pressed="false">List</button>
      </div>
    </div>
  </header>
  <section class="pp-tags" aria-label="Filter by tag"></section>
  <div id="pp-results" class="pp-grid" role="list" aria-live="polite" aria-busy="true"></div>
  <template id="pp-card">
    <article class="pp-card" role="listitem">
      <a class="pp-thumb" target="_self" rel="noopener"></a>
      <div class="pp-body">
        <div class="pp-top">
          <h3 class="pp-title"><a class="pp-link" target="_self" rel="noopener"></a></h3>
          <div class="pp-meta">
            <button class="pp-icon pp-fav" title="Favorite (f)" aria-pressed="false" aria-label="Toggle favorite">
              <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path class="pp-star" d="M12 .587l3.668 7.568L24 9.75l-6 5.854 1.416 8.264L12 19.771l-7.416 4.097L6 15.604 0 9.75l8.332-1.595z"/></svg>
            </button>
            <button class="pp-icon pp-share" title="Copy link" aria-label="Copy link">
              <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a3 3 0 0 0-2.816 1.983l-6.07-3.035a3 3 0 1 0-.248 1.01l6.07 3.036a3 3 0 1 0 .064-1.012z"/></svg>
            </button>
          </div>
        </div>
        <p class="pp-desc"></p>
        <ul class="pp-tagsline" aria-label="Tags"></ul>
      </div>
    </article>
  </template>

    {"id":"sankey-2024","title":"Case Resolution Sankey (2024)","url":"/case_resolution_sankey_2024.html","desc":"Flow from report to outcome.","tags":["flow","visualization","process"],"date":"2025-06-20"},

  <style>.projects-pro{--bg:#fff;--ink:#0a0a0a;--muted:#6b7280;--ring:#3b82f6;--card:#f8fafc;--bd:rgba(0,0,0,.12);--soft:rgba(0,0,0,.06);--chip:#e5e7eb;--chip-ink:#111827;--brand:#4f46e5;--fav:#f59e0b;--shadow:0 10px 30px rgba(0,0,0,.08);margin:1.25rem auto;max-width:1100px;padding:0 16px}@media (prefers-color-scheme: dark){.projects-pro{--bg:#0b0f17;--ink:#e5e7eb;--muted:#94a3b8;--card:#0f1522;--bd:rgba(255,255,255,.12);--soft:rgba(255,255,255,.06);--chip:#1f2937;--chip-ink:#d1d5db;--brand:#7c8cff;--shadow:0 18px 40px rgba(0,0,0,.45)}}.pp-header{display:flex;gap:16px;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}.pp-h1{font-size:2rem;margin:.25rem 0;color:var(--ink)} .pp-sub{margin:0;color:var(--muted)}.pp-actions{display:flex;gap:10px;flex-wrap:wrap}.pp-input,.pp-select,.pp-btn{border:1px solid var(--bd);background:var(--bg);color:var(--ink);border-radius:10px;padding:.55rem .7rem}.pp-btn{cursor:pointer}.pp-btn.is-active{outline:2px solid var(--brand);outline-offset:2px}.pp-tags{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}.pp-chip{border:1px solid var(--bd);background:var(--chip);color:var(--chip-ink);border-radius:999px;padding:.35rem .7rem;font-size:.9rem;cursor:pointer}.pp-chip.is-on{background:var(--brand);color:#fff;border-color:transparent}.pp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.pp-list{display:block}.pp-card{background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;min-height:180px;transition:transform .2s ease,box-shadow .2s ease}.pp-card:hover{transform:translateY(-3px)} .pp-thumb{display:block;min-height:120px;background:linear-gradient(135deg,var(--soft),transparent),radial-gradient(ellipse at bottom right,var(--soft),transparent)}.pp-body{padding:14px}.pp-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.pp-title{font-size:1.05rem;margin:.1rem 0}.pp-title a{color:var(--ink);text-decoration:none}.pp-desc{margin:.4rem 0;color:var(--muted)} .pp-tagsline{display:flex;flex-wrap:wrap;gap:6px;margin:.35rem 0 0;padding:0;list-style:none}.pp-tag{font-size:.8rem;border:1px solid var(--bd);border-radius:999px;padding:.2rem .5rem;color:var(--muted)}.pp-meta{display:flex;gap:6px}.pp-icon{background:transparent;border:1px solid var(--bd);border-radius:10px;padding:.35rem;cursor:pointer}.pp-icon:focus{outline:2px solid var(--ring);outline-offset:2px}.pp-star{fill:transparent;stroke:var(--fav);stroke-width:1.2}.is-fav .pp-star{fill:var(--fav)}.pp-list .pp-card{flex-direction:row}.pp-list .pp-thumb{width:240px;min-height:100%}@media (prefers-reduced-motion: reduce){.pp-card,.pp-card:hover{transition:none;transform:none}}</style>
  <script>(()=>{const $=(s,e=document)=>e.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)];const list=$('#pp-results'),tpl=$('#pp-card'),input=$('#pp-search'),sortSel=$('#pp-sort'),chipsWrap=$('.pp-tags');const btnGrid=$('#pp-view-grid'),btnList=$('#pp-view-list');const FAVORITES_KEY='pp:favorites';const data=JSON.parse($('#pp-data').textContent);const favs=new Set(JSON.parse(localStorage.getItem(FAVORITES_KEY)||'[]'));const allTags=[...new Set(data.flatMap(p=>p.tags))].sort();const qs=new URLSearchParams(location.search);let state={q:qs.get('q')||'',tags:new Set((qs.get('tags')||'').split(',').filter(Boolean)),sort:qs.get('sort')||'newest',view:qs.get('view')||'grid'};input.value=state.q;sortSel.value=state.sort;setView(state.view);const favChip=chip('favorites','★ Favorites');chipsWrap.append(favChip);allTags.forEach(t=>chipsWrap.append(chip(t)));function chip(tag,label){const c=document.createElement('button');c.className='pp-chip';c.textContent=label||tag;c.dataset.tag=tag;if(state.tags.has(tag))c.classList.add('is-on');c.onclick=()=>{state.tags.has(tag)?(state.tags.delete(tag),c.classList.remove('is-on')):(state.tags.add(tag),c.classList.add('is-on'));syncQS();render();};return c;}function render(){list.setAttribute('aria-busy','true');list.innerHTML='';let rows=data.slice();const q=state.q.trim().toLowerCase();if(q)rows=rows.filter(p=>(p.title+p.desc+p.tags.join(' ')).toLowerCase().includes(q));const tags=[...state.tags];if(tags.length){const favOn=state.tags.has('favorites');rows=rows.filter(p=>{const hasAll=tags.filter(t=>t!=='favorites').every(t=>p.tags.includes(t));return (favOn?favs.has(p.id):true)&&(tags.some(t=>t!=='favorites')?hasAll:true);});}if(state.sort==='az')rows.sort((a,b)=>a.title.localeCompare(b.title));else rows.sort((a,b)=>(b.date||'').localeCompare(a.date||''));for(const p of rows){const n=tpl.content.firstElementChild.cloneNode(true);const link=$('.pp-link',n),th=$('.pp-thumb',n),ds=$('.pp-desc',n),tl=$('.pp-tagsline',n),fav=$('.pp-fav',n),sh=$('.pp-share',n);link.href=p.url;link.textContent=p.title;link.title=p.title;th.href=p.url;ds.textContent=p.desc;p.tags.forEach(t=>{const li=document.createElement('li');li.className='pp-tag';li.textContent=t;tl.appendChild(li);});fav.setAttribute('aria-pressed',favs.has(p.id)?'true':'false');if(favs.has(p.id))n.classList.add('is-fav');fav.onclick=()=>{favs.has(p.id)?favs.delete(p.id):favs.add(p.id);localStorage.setItem(FAVORITES_KEY,JSON.stringify([...favs]));render();};sh.onclick=async()=>{const u=new URL(p.url,location.origin);u.hash=p.id;try{await navigator.clipboard.writeText(u.toString());sh.textContent='Copied';setTimeout(()=>sh.innerHTML='<svg width="18" height="18" viewBox="0 0 24 24"><path d="M18 8a3 3 0 0 0-2.816 1.983l-6.07-3.035a3 3 0 1 0-.248 1.01l6.07 3.036a3 3 0 1 0 .064-1.012z"/></svg>',1200);}catch{}};list.appendChild(n);}list.className=state.view==='list'?'pp-list':'pp-grid';list.setAttribute('aria-busy','false');}function setView(v){state.view=(v==='list')?'list':'grid';btnGrid.classList.toggle('is-active',state.view==='grid');btnList.classList.toggle('is-active',state.view==='list');btnGrid.setAttribute('aria-pressed',state.view==='grid');btnList.setAttribute('aria-pressed',state.view==='list');syncQS();render();}function syncQS(){const p=new URLSearchParams();if(state.q)p.set('q',state.q);if(state.tags.size)p.set('tags',[...state.tags].join(','));if(state.sort!=='newest')p.set('sort',state.sort);if(state.view!=='grid')p.set('view',state.view);const u=location.pathname+(p.toString()?('?'+p.toString()):'');history.replaceState(null,'',u);}input.oninput=e=>{state.q=e.target.value;syncQS();render();};sortSel.onchange=e=>{state.sort=e.target.value;syncQS();render();};btnGrid.onclick=()=>setView('grid');btnList.onclick=()=>setView('list');document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==input){e.preventDefault();input.focus();}if(e.key.toLowerCase()==='g')setView('grid');if(e.key.toLowerCase()==='l')setView('list');if(e.key.toLowerCase()==='f'&&list.firstElementChild){const b=list.firstElementChild.querySelector('.pp-fav');if(b)b.click();}});render();})();</script>
</section>
