<header class="bg-gray-50/95 dark:bg-slate-900/95 backdrop-blur supports-[backdrop-filter]:bg-gray-50/85 shadow-sm sticky top-0 w-full z-50 border-b border-slate-200/70 dark:border-slate-700/80 header-wrap">
  <div class="relative mx-auto flex max-w-6xl items-center justify-between gap-4 px-4 py-4">
    <a href="https://jgwalsh.com/"
      class="flex items-center gap-3 text-2xl font-semibold text-navy tracking-tight focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-teal-500">
      <img src="/assets/favicon/favicon-48.png" alt="Monogram J.G.W." class="h-10 w-10" width="48" height="48"

        <path stroke="currentColor" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" fill="none" stroke-linecap="round"

        <a href="https://jgwalsh.com/"

        <a href="https://jgwalsh.com/about.html"
          class="px-4 py-2 rounded-full transition-colors hover:text-teal-600 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-teal-500 md:px-3 md:py-2">About</a>
        <a href="https://jgwalsh.com/resume.html"
          class="px-4 py-2 rounded-full transition-colors hover:text-teal-600 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-teal-500 md:px-3 md:py-2">Résumé</a>
        <a href="https://jgwalsh.com/projects/"

        <a href="https://jgwalsh.com/blog/"

        <a href="https://jgwalsh.com/contact.html"
          class="px-4 py-2 rounded-full transition-colors hover:text-teal-600 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-teal-500 md:px-3 md:py-2">Contact</a>

          aria-pressed="false">
          <span class="switch__track" aria-hidden="true"><span class="switch__thumb"></span></span>
        </button>
        <button id="theme-toggle-mobile"
          class="w-full rounded-full border border-slate-200 px-4 py-2 text-left theme-toggle focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-teal-500 dark:border-slate-700 md:hidden"
          type="button" aria-pressed="false" aria-label="Switch theme">
          <span class="switch__track" aria-hidden="true"><span class="switch__thumb"></span></span>
