<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secure Notes – J. Gregory Walsh</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; }
    .font-serif { font-family: 'DM Serif Display', serif; }
    .fade { transition: opacity 0.3s ease; }
  </style>
</head>
<body class="text-slate-800">
  <div class="max-w-2xl mx-auto px-6 py-10">
    <header class="mb-8">
      <h1 class="text-3xl font-serif font-bold text-slate-900 mb-1">Secure Notes</h1>
      <p class="text-sm text-slate-700">Access granted to <code id="userEmail">...</code></p>
    </header>

    <main>
      <form id="noteForm" class="bg-white border border-slate-200 rounded-lg p-6 shadow-sm mb-8">
        <h2 class="text-lg font-serif font-semibold mb-4 text-slate-800">New Note</h2>
        <input id="title" type="text" placeholder="Title" required class="w-full mb-3 px-3 py-2 border border-slate-300 rounded text-sm" />
        <textarea id="body" placeholder="Body..." required class="w-full h-32 px-3 py-2 border border-slate-300 rounded text-sm"></textarea>
        <button type="submit" class="mt-4 bg-slate-800 text-white px-4 py-2 rounded hover:bg-slate-900 text-sm">Save Note</button>
        <p class="mt-2 text-xs text-slate-500">Notes are saved to secure Cloudflare KV storage. Session required.</p>
      </form>

      <section>
        <h2 class="text-lg font-serif font-semibold text-slate-800 mb-2">Saved Notes</h2>
        <ul id="notesList" class="space-y-3 text-sm text-slate-700"></ul>
        <p id="notesError" class="text-red-600 text-sm mt-2 hidden">Error loading notes.</p>
      </section>

      <section class="mt-8 text-sm text-slate-600">
        <a href="/private/index.html" class="text-blue-700 hover:underline">&larr; Return to dashboard</a>
      </section>
    </main>
  </div>

  <script>
    const emailSpan = document.getElementById('userEmail');
    const form = document.getElementById('noteForm');
    const notesList = document.getElementById('notesList');
    const notesError = document.getElementById('notesError');

    function parseJwtPayload(jwt) {
      try {
        const payload = jwt.split('.')[1];
        return JSON.parse(atob(payload.replace(/-/g, '+').replace(/_/g, '/')));
      } catch { return null; }
    }

    function getJWT() {
      return document.cookie.split('; ').find(row => row.startsWith('CF_Authorization='))?.split('=')[1];
    }

    async function loadNotes() {
      try {
        const res = await fetch('https://notes-worker.jgregorywalsh.workers.dev/notes');
        const notes = await res.json();

        if (!Array.isArray(notes)) throw new Error();

        notesList.innerHTML = notes.map(note => `
          <li class="border border-slate-200 rounded p-3 bg-white">
            <h3 class="font-semibold text-slate-900">${note.title}</h3>
            <p class="text-slate-600 mt-1">${note.body}</p>
            <p class="text-xs text-slate-400 mt-2">${note.timestamp}</p>
          </li>
        `).join('');
      } catch {
        notesError.classList.remove('hidden');
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('title').value.trim();
      const body = document.getElementById('body').value.trim();

      if (!title || !body) return;

      const res = await fetch('https://notes-worker.jgregorywalsh.workers.dev', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, body })
      });

      if (res.ok) {
        const json = await res.json();
        alert(`Note saved as: ${json.id}`);
        form.reset();
        loadNotes();
      } else {
        alert('Failed to save note.');
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      const jwt = getJWT();
      const payload = parseJwtPayload(jwt);
      if (payload?.email) emailSpan.textContent = payload.email;
      loadNotes();
    });
  </script>
</body>
</html>
