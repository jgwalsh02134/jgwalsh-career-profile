<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secure Documents – J. Gregory Walsh</title>
  <link rel="icon" type="image/svg+xml" href="/w1-favicon.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
  </style>
</head>
<body class="text-slate-800">
  <div class="max-w-3xl mx-auto px-6 py-12">
    <h1 class="text-3xl font-serif font-bold text-slate-900 mb-4">Secure Documents</h1>
    <p class="text-sm text-slate-600 mb-6">Access granted to <code id="userEmail">. . .</code></p>

    <p class="text-sm text-slate-500 mb-4">Files are stored securely in Cloudflare R2 Object Storage and encrypted at rest. Only authenticated sessions may access this list.</p>

    <h2 class="text-xl font-semibold mb-3">Uploaded Files</h2>
    <ul id="uploadedFiles" class="space-y-2 text-sm text-blue-700 underline"></ul>

    <p class="text-sm mt-8">
      <a href="/private/index.html" class="text-blue-700 hover:underline">&larr; Return to dashboard</a>
    </p>
  </div>

  <script>
    function getCookie(name) {
      const value = `; ${document.cookie}`;
      const parts = value.split(`; ${name}=`);
      return parts.length === 2 ? parts.pop().split(';').shift() : null;
    }

    function decodeJWT(token) {
      try {
        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        return JSON.parse(atob(base64));
      } catch { return null; }
    }

    async function loadUploadedDocs() {
      const jwt = getCookie('CF_Authorization');
      if (!jwt) return alert('Session invalid or expired.');

      const payload = decodeJWT(jwt);
      if (payload?.email) {
        document.getElementById('userEmail').textContent = payload.email;
      }

      const res = await fetch('/api/list-docs', {
        headers: { 'cf-access-jwt-assertion': jwt }
      });

      if (!res.ok) {
        document.getElementById('uploadedFiles').innerHTML = '<li class="text-red-600">Failed to load documents.</li>';
        return;
      }

      const data = await res.json();
      const list = document.getElementById('uploadedFiles');
      data.files.forEach(file => {
        const li = document.createElement('li');
        li.innerHTML = `<a href="${file.url}" target="_blank">${file.name}</a>`;
        list.appendChild(li);
      });
    }

    loadUploadedDocs();
  </script>
</body>
</html>
