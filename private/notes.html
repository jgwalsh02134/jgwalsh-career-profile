<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secure Notes – J. Gregory Walsh</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8f9fa;
    }
    .font-serif {
      font-family: 'DM Serif Display', serif;
    }
  </style>
</head>
<body class="text-slate-800">
  <div class="max-w-xl mx-auto px-6 py-12">
    <header class="mb-8">
      <h1 class="text-3xl font-serif font-bold text-slate-900 mb-1">Secure Notes</h1>
      <p class="text-sm text-slate-600">Access granted to <code id="userEmail" class="font-mono text-slate-700">...</code></p>
    </header>

    <form id="noteForm" class="bg-white border border-slate-200 rounded-lg p-6 shadow-sm space-y-4">
      <h2 class="text-lg font-semibold font-serif text-slate-800">New Note</h2>
      <input type="text" id="title" name="title" placeholder="Title" class="w-full border border-slate-300 rounded px-3 py-2 text-sm" required />
      <textarea id="body" name="body" placeholder="Body..." class="w-full border border-slate-300 rounded px-3 py-2 text-sm h-40" required></textarea>
      <button type="submit" class="bg-slate-800 text-white px-4 py-2 rounded hover:bg-slate-900">Save Note</button>
      <p class="text-xs text-slate-500">Notes are saved to secure Cloudflare KV storage. Session required.</p>
    </form>

    <footer class="mt-6 text-sm text-slate-600">
      <a href="/private/index.html" class="text-blue-700 hover:underline">&larr; Return to dashboard</a>
    </footer>
  </div>

  <script>
    function parseJwtPayload(jwt) {
      try {
        const payload = jwt.split('.')[1];
        const decoded = atob(payload.replace(/-/g, '+').replace(/_/g, '/'));
        return JSON.parse(decoded);
      } catch (e) {
        return null;
      }
    }

    function setUserEmail() {
      const jwt = document.cookie.split('; ').find(row => row.startsWith('CF_Authorization='))?.split('=')[1];
      const payload = parseJwtPayload(jwt);
      document.getElementById('userEmail').textContent = payload?.email || '[unauthenticated]';
    }

    document.getElementById('noteForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const title = document.getElementById('title').value.trim();
      const body = document.getElementById('body').value.trim();

      if (!title || !body) {
        alert('Please enter both a title and body.');
        return;
      }

      try {
        const res = await fetch("https://notes-worker.jgregorywalsh.workers.dev", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title, body })
        });

        if (!res.ok) throw new Error("Failed to save note");
        const json = await res.json();
        alert(`Note saved as ${json.id}`);
        document.getElementById('noteForm').reset();
      } catch (err) {
        console.error(err);
        alert("Error saving note.");
      }
    });

    document.addEventListener('DOMContentLoaded', setUserEmail);
  </script>
</body>
</html>
