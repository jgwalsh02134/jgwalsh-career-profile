<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Application Materials – J. Gregory Walsh</title>
  <meta http-equiv="Cache-Control" content="no-store"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.tailwindcss.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; connect-src 'self' https://www.cloudflare.com; img-src 'self' data:; font-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com"/>
  <script src="https://cdn.tailwindcss.com" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f9fafb; }
    .font-serif { font-family: 'DM Serif Display', serif; }
    .prose pre, .prose code { background-color: #f3f4f6; padding: 0.25rem 0.5rem; border-radius: 0.25rem; font-size: 0.875rem; }
  </style>
</head>
<body class="text-slate-800">
  <div class="max-w-4xl mx-auto px-6 py-12">
    <header class="mb-8">
      <h1 class="text-3xl font-serif font-bold text-slate-900">Application Materials</h1>
      <p class="text-sm text-slate-600">Access granted to <code id="userEmail">loading…</code></p>
    </header>

    <section class="bg-white border border-slate-200 rounded-lg p-6 shadow-sm mb-8">
      <h2 class="text-lg font-semibold mb-4">Add Document Reference</h2>
      <form id="applicationForm" class="space-y-3">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <input id="docType" type="text" placeholder="Document Type (e.g. SF-86, Cover Letter)" class="border border-slate-300 rounded px-3 py-2 text-sm w-full" required />
          <input id="agencyRole" type="text" placeholder="Agency / Role (e.g. FBI, USMS)" class="border border-slate-300 rounded px-3 py-2 text-sm w-full" required />
        </div>
        <input id="submissionDate" type="date" class="border border-slate-300 rounded px-3 py-2 text-sm w-full" required />
        <input id="docLink" type="url" placeholder="Optional link to hosted file or document (https://...)" class="border border-slate-300 rounded px-3 py-2 text-sm w-full" />
        <textarea id="comments" placeholder="Optional comments or markdown-formatted notes..." class="w-full border border-slate-300 rounded px-3 py-2 text-sm font-mono" rows="4"></textarea>
        <button type="submit" class="mt-2 bg-slate-800 text-white px-4 py-2 rounded hover:bg-slate-900 text-sm">Add Record</button>
      </form>
    </section>

    <section>
      <h2 class="text-lg font-semibold mb-3">Saved Records</h2>
      <div id="applicationsList" class="space-y-4"></div>
    </section>

    <footer class="mt-12 border-t pt-4 text-sm text-slate-600">
      <p class="mb-1">This page is protected by <strong>Cloudflare Zero Trust</strong>. Session access expires after 12 hours.</p>
      <a href="/private/index.html" class="text-blue-700 hover:underline">&larr; Return to dashboard</a>
    </footer>
  </div>

  <script>
    function parseJwtPayload(jwt) {
      try {
        const payload = jwt.split('.')[1];
        const decoded = atob(payload.replace(/-/g, '+').replace(/_/g, '/'));
        return JSON.parse(decoded);
      } catch { return null; }
    }

    function warnIfInsecure() {
      if (location.protocol !== 'https:') {
        window.location.replace('https://' + location.host + location.pathname + location.search);
      }
    }

    function loadUser() {
      const cookie = document.cookie.split('; ').find(row => row.startsWith('CF_Authorization='));
      if (!cookie) {
        window.location.replace('/login.html');
        return;
      }
      const jwt = cookie.split('=')[1];
      const payload = parseJwtPayload(jwt);
      if (!payload) {
        window.location.replace('/login.html');
        return;
      }
      if (payload.exp * 1000 <= Date.now()) {
        window.location.replace('https://dash.cloudflare.com/logout');
        return;
      }
      document.getElementById('userEmail').textContent = payload.email || '[unauthenticated]';
    }

    function renderRecords() {
      const container = document.getElementById('applicationsList');
      container.innerHTML = '';
      const records = JSON.parse(localStorage.getItem('appRecords') || '[]');
      records.sort((a, b) => new Date(b.submissionDate) - new Date(a.submissionDate));
      records.forEach((rec, idx) => {
        const div = document.createElement('div');
        div.className = 'border border-slate-200 rounded p-4 bg-white shadow-sm';
        div.innerHTML = `
          <div class="flex justify-between items-start">
            <div>
              <h3 class="font-semibold text-slate-900 mb-1">${rec.docType}</h3>
              <p class="text-sm text-slate-600 mb-1">${rec.agencyRole} &middot; <span class="text-xs text-slate-500">${rec.submissionDate}</span></p>
              ${rec.docLink ? `<p class="text-sm text-blue-600"><a href="${rec.docLink}" target="_blank" rel="noopener">View Document</a></p>` : ''}
              <div class="prose prose-sm text-slate-700 mt-2">${marked.parse(rec.comments || '')}</div>
            </div>
            <button onclick="deleteRecord(${idx})" class="text-sm text-red-600 hover:underline">Delete</button>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function deleteRecord(index) {
      const records = JSON.parse(localStorage.getItem('appRecords') || '[]');
      records.splice(index, 1);
      localStorage.setItem('appRecords', JSON.stringify(records));
      renderRecords();
    }

    document.getElementById('applicationForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const docType = document.getElementById('docType').value.trim();
      const agencyRole = document.getElementById('agencyRole').value.trim();
      const submissionDate = document.getElementById('submissionDate').value;
      const docLink = document.getElementById('docLink').value.trim();
      const comments = document.getElementById('comments').value.trim();

      const entry = { docType, agencyRole, submissionDate, docLink, comments, timestamp: new Date().toISOString() };
      const records = JSON.parse(localStorage.getItem('appRecords') || '[]');
      records.push(entry);
      localStorage.setItem('appRecords', JSON.stringify(records));
      this.reset();
      renderRecords();
    });

    document.addEventListener('DOMContentLoaded', () => {
      warnIfInsecure();
      loadUser();
      renderRecords();
    });
  </script>
</body>
</html>
