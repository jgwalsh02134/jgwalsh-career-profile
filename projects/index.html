<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Projects & Portfolio — James Gregory Walsh</title>
  <meta name="description" content="A selection of projects demonstrating analysis, research, visualization, and psych-tech initiatives.">
  <link rel="canonical" href="/projects/">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="/assets/css/projects.css">
</head>
<body style="background:var(--bg); color:var(--text);">
  <main class="page-wrap" id="projects-app">
    <header class="header" aria-labelledby="title">
      <h1 id="title">Projects & Portfolio</h1>
      <p>A selection of projects demonstrating analysis, research, visualization, and psych-tech initiatives.</p>
    </header>

    <section class="toolbar" aria-label="Project controls">
      <div class="search" role="search">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24"><path fill="currentColor" d="M21 21l-4.2-4.2m1.2-4a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input id="q" type="search" placeholder="Search projects…" autocomplete="off" />
      </div>
      <div class="filters" aria-label="Filters">
        <!-- Pills added by JS from distinct types/tags -->
      </div>
      <div class="sort">
        <label for="sort">Sort</label>
        <select id="sort" aria-label="Sort">
          <option value="featured">Featured</option>
          <option value="newest">Newest</option>
          <option value="oldest">Oldest</option>
          <option value="az">A–Z</option>
        </select>
      </div>
    </section>

    <section class="grid" id="grid" aria-live="polite">
      <article class="card skeleton" aria-hidden="true" style="height:280px;"></article>
      <article class="card skeleton" aria-hidden="true" style="height:280px;"></article>
      <article class="card skeleton" aria-hidden="true" style="height:280px;"></article>
    </section>

    <div class="empty" id="empty" hidden>No results. Try clearing filters.</div>
  </main>

  <script type="module" src="/assets/js/projects.js"></script>
</body>
  
</html>
