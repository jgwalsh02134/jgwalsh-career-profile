<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Private Administrative Dashboard</title>

  <!-- Content Security Policy (CSP) -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com 'unsafe-inline'; style-src 'self' https://cdn.jsdelivr.net https://unpkg.com https://fonts.googleapis.com https://fonts.gstatic.com 'unsafe-inline'; font-src https://fonts.gstatic.com; connect-src 'self' https://www.cloudflare.com; img-src 'self' data:;" />

  <!-- Tailwind CSS -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.1/dist/tailwind.min.css" rel="stylesheet">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;700&display=swap" rel="stylesheet" />

  <!-- FilePond CSS -->
  <link href="https://unpkg.com/filepond@^4/dist/filepond.min.css" rel="stylesheet" />

  <!-- Early security checks (HTTPS redirect, JWT validation, expiration check) -->
  <script>
    function parseJwtPayload(jwt) {
      try {
        const payload = jwt.split('.')[1];
        const decodedPayload = atob(payload.replace(/-/g, '+').replace(/_/g, '/'));
        return JSON.parse(decodedPayload);
      } catch {
        return null;
      }
    }

    function logout() {
      document.cookie = 'CF_Authorization=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; secure; SameSite=Strict';
      // For production, use: location.href = 'https://{your-team-name}.cloudflareaccess.com/cdn-cgi/access/logout';
      // In preview mode, avoid redirect to prevent 404; just reload or show message
      console.log('Logout triggered - in preview mode, not redirecting');
      location.reload(); // Reload to reflect unauthenticated state without 404
    }

    // Force HTTPS (may not apply in preview environments)
    if (location.protocol !== 'https:' && location.hostname !== 'localhost' && !location.hostname.includes('preview')) {
      location.href = 'https://' + location.hostname + location.pathname + location.search + location.hash;
    }

    // Check for valid JWT and expiration - in preview, skip redirect and use mock data if needed
    const isPreviewMode = location.hostname === 'localhost' || location.hostname.includes('preview') || location.hostname === ''; // Adjust for Grok Studio preview
    const cookies = document.cookie.split('; ');
    const authCookie = cookies.find(row => row.startsWith('CF_Authorization='));
    const jwt = authCookie ? authCookie.split('=')[1] : null;

    if (!jwt) {
      if (!isPreviewMode) {
        logout();
      } else {
        console.log('Preview mode: No JWT found, proceeding without auth');
        // Optional: Set mock user info for preview
        document.addEventListener('DOMContentLoaded', () => {
          const userEl = document.getElementById('userEmail');
          if (userEl) userEl.textContent = 'preview@example.com';
          const startEl = document.getElementById('sessionStart');
          if (startEl) startEl.textContent = new Date().toLocaleString();
          const endEl = document.getElementById('sessionEnd');
          if (endEl) endEl.textContent = new Date(Date.now() + 3600000).toLocaleString(); // 1 hour from now
          const countdownEl = document.getElementById('sessionCountdown');
          if (countdownEl) countdownEl.textContent = 'Preview Mode';
        });
      }
    } else {
      const payload = parseJwtPayload(jwt);
      if (!payload || (payload.exp * 1000 < Date.now())) {
        if (!isPreviewMode) {
          logout();
        } else {
          console.log('Preview mode: Invalid/expired JWT, proceeding anyway');
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8f9fa;
    }
    .font-serif {
      font-family: 'DM Serif Display', serif;
    }
    @keyframes blink {
      50% { opacity: 0; }
    }
    .blinking-cursor {
      animation: blink 1s step-start infinite;
      font-weight: bold;
    }
    .card:hover {
      box-shadow: 0 6px 12px rgba(0,0,0,0.08);
      transition: box-shadow 0.3s ease;
    }
    .label-metadata {
      font-size: 0.75rem;
      font-family: monospace;
      color: #64748b;
    }
  </style>
</head>
<body class="text-slate-800">
  <!-- HTML content omitted for brevity (unchanged structure, assume includes elements like userEmail, sessionStart, sessionEnd, sessionCountdown, clientIP, clientBrowser, and <input type="file" class="filepond"> or <div class="filepond"></div>) -->

  <!-- FilePond Plugins Scripts (moved to end for non-blocking load) -->
  <script src="https://unpkg.com/filepond@^4/dist/filepond.min.js" defer></script>
  <script src="https://unpkg.com/filepond-plugin-file-validate-type/dist/filepond-plugin-file-validate-type.min.js" defer></script>
  <script src="https://unpkg.com/filepond-plugin-file-validate-size/dist/filepond-plugin-file-validate-size.min.js" defer></script>

  <!-- Session and FilePond -->
  <script>
    function updateUserSessionInfo() {
      const jwt = document.cookie.split('; ').find(row => row.startsWith('CF_Authorization='))?.split('=')[1];
      const userEl = document.getElementById('userEmail');
      if (!jwt || !userEl) {
        if (userEl) userEl.textContent = 'Not Authenticated';
        return;
      }
      const payload = parseJwtPayload(jwt);
      if (!payload) return;
      document.getElementById('userEmail')?.textContent = payload.email || 'unknown';
      document.getElementById('sessionStart')?.textContent = new Date(payload.iat * 1000).toLocaleString();
      document.getElementById('sessionEnd')?.textContent = new Date(payload.exp * 1000).toLocaleString();
      const countdownEl = document.getElementById('sessionCountdown');
      if (!countdownEl) return;
      function updateCountdown() {
        const now = Date.now();
        const secondsLeft = Math.floor((payload.exp * 1000 - now) / 1000);
        if (secondsLeft <= 0) {
          countdownEl.textContent = 'Session Expired';
          return;
        }
        if (secondsLeft < 300) countdownEl.classList.replace('text-green-400', 'text-yellow-400');
        const hrs = String(Math.floor(secondsLeft / 3600)).padStart(2, '0');
        const mins = String(Math.floor((secondsLeft % 3600) / 60)).padStart(2, '0');
        const secs = String(secondsLeft % 60).padStart(2, '0');
        countdownEl.textContent = `${hrs}:${mins}:${secs}`;
        requestAnimationFrame(updateCountdown);
      }
      updateCountdown();
    }

    function detectClientInfo() {
      const ipEl = document.getElementById('clientIP');
      const browserEl = document.getElementById('clientBrowser');
      if (!browserEl) return;
      browserEl.textContent = navigator.userAgent || 'Unknown';
      if (!ipEl) return;
      fetch("https://www.cloudflare.com/cdn-cgi/trace")
        .then(res => res.text())
        .then(text => {
          const ipMatch = text.match(/ip=([^\n]+)/);
          ipEl.textContent = (ipMatch ? ipMatch[1] : 'Unavailable');
        })
        .catch(() => {
          ipEl.textContent = 'Unavailable';
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (typeof FilePond !== 'undefined' && FilePondPluginFileValidateType && FilePondPluginFileValidateSize) {
        FilePond.registerPlugin(FilePondPluginFileValidateType, FilePondPluginFileValidateSize);
        const pondElement = document.querySelector('.filepond');
        if (pondElement) {
          FilePond.create(pondElement, {
            acceptedFileTypes: ['application/pdf', 'image/*'],
            maxFileSize: '5MB',
            labelIdle: '📄 Drag & Drop your files or <span class="filepond--label-action">Browse</span>',
            credits: false,
            server: '/api/upload' // Placeholder; in preview, uploads won't work but UI will show
          });
        } else {
          console.warn('FilePond element not found.');
        }
      } else {
        console.warn('FilePond or plugins not loaded.');
      }

      updateUserSessionInfo();
      detectClientInfo();
    });
  </script>
</body>
</html>
