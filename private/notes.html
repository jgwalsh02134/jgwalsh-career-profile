<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secure Notes – J. Gregory Walsh</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; }
    .font-serif { font-family: 'DM Serif Display', serif; }
    pre { white-space: pre-wrap; word-break: break-word; }
    .note-preview { display: none; padding: 1rem; background: #fff; border: 1px solid #e2e8f0; border-radius: 0.375rem; margin-top: 1rem; }
  </style>
</head>
<body class="text-slate-800">
  <div class="max-w-2xl mx-auto px-6 py-10">
    <header class="mb-8">
      <h1 class="text-3xl font-serif font-bold text-slate-900 mb-2">Secure Notes</h1>
      <p class="text-sm text-slate-700">Access granted to <code id="userEmail">authenticated user</code></p>
    </header>

    <main>
      <section class="bg-white border border-slate-200 rounded-lg p-6 shadow-sm mb-8">
        <h2 class="text-lg font-semibold font-serif mb-4 text-slate-800">New Note</h2>
        <input id="noteTitle" class="w-full mb-3 border border-slate-300 rounded p-2 text-sm" type="text" placeholder="Title">
        <textarea id="noteBody" class="w-full border border-slate-300 rounded p-2 text-sm font-mono text-slate-800 h-32" placeholder="Body..."></textarea>
        <div class="mt-2">
          <label class="text-sm"><input type="checkbox" id="togglePreview" onchange="togglePreview()" /> Show Preview</label>
        </div>
        <div id="previewPanel" class="note-preview"></div>
        <button onclick="saveNote()" class="mt-3 bg-slate-800 text-white px-4 py-2 rounded hover:bg-slate-900">Save Note</button>
        <p class="mt-2 text-xs text-slate-500">Notes are saved to secure Cloudflare KV storage. Session required.</p>
      </section>

      <section class="mb-6">
        <input id="searchInput" class="w-full mb-4 border border-slate-300 rounded p-2 text-sm" type="text" placeholder="Search notes..." oninput="renderNotes()">
        <div id="notesList" class="space-y-4"></div>
        <div class="mt-4 flex justify-between">
          <button id="prevBtn" onclick="loadNotes(true)" class="text-sm text-blue-700 hover:underline" disabled>&larr; Previous</button>
          <button id="nextBtn" onclick="loadNotes()" class="text-sm text-blue-700 hover:underline" disabled>Next &rarr;</button>
        </div>
      </section>

      <a href="/private/index.html" class="text-blue-700 text-sm hover:underline">&larr; Return to dashboard</a>
    </main>
  </div>

  <script>
    let cursor = null;
    let prevCursors = [];
    let notes = [];

    const titleInput = document.getElementById('noteTitle');
    const bodyInput = document.getElementById('noteBody');
    const previewPanel = document.getElementById('previewPanel');
    const togglePreviewBox = document.getElementById('togglePreview');

    function togglePreview() {
      if (togglePreviewBox.checked) {
        previewPanel.style.display = 'block';
        previewPanel.innerHTML = marked.parse(bodyInput.value);
      } else {
        previewPanel.style.display = 'none';
      }
    }

    bodyInput.addEventListener('input', () => {
      if (togglePreviewBox.checked) {
        previewPanel.innerHTML = marked.parse(bodyInput.value);
      }
      localStorage.setItem('noteDraftBody', bodyInput.value);
    });

    titleInput.addEventListener('input', () => {
      localStorage.setItem('noteDraftTitle', titleInput.value);
    });

    function saveNote() {
      const title = titleInput.value.trim();
      const body = bodyInput.value.trim();
      if (!title || !body) return alert("Both title and body are required.");

      fetch("https://notes-worker.jgregorywalsh.workers.dev", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title, body })
      }).then(res => {
        if (res.ok) {
          titleInput.value = '';
          bodyInput.value = '';
          localStorage.removeItem('noteDraftTitle');
          localStorage.removeItem('noteDraftBody');
          loadNotes();
        } else {
          alert("Error saving note.");
        }
      });
    }

    function deleteNote(key) {
      if (!confirm("Delete this note?")) return;
      fetch(`https://notes-worker.jgregorywalsh.workers.dev?key=${encodeURIComponent(key)}`, {
        method: "DELETE"
      }).then(res => {
        if (res.ok) loadNotes();
        else alert("Delete failed.");
      });
    }

    function duplicateNote(title, body) {
      titleInput.value = title + " (copy)";
      bodyInput.value = body;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderNotes() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const container = document.getElementById('notesList');
      container.innerHTML = '';
      const filtered = notes.filter(n => n.title.toLowerCase().includes(query) || n.body.toLowerCase().includes(query));

      if (!filtered.length) {
        container.innerHTML = '<p class="text-sm text-red-600">No matching notes found.</p>';
        return;
      }

      for (const note of filtered) {
        const div = document.createElement('div');
        div.className = 'bg-white border border-slate-200 rounded p-4 shadow-sm relative';
        div.innerHTML = `
          <strong>${note.title}</strong>
          <p class="text-sm mt-1">${note.body}</p>
          <p class="text-xs mt-2 text-slate-500">${new Date(note.timestamp || Date.now()).toLocaleString('en-US', {
            year: 'numeric', month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true, timeZone: 'UTC', timeZoneName: 'short'})}</p>
          <div class="absolute top-2 right-3 space-x-2">
            <button onclick="duplicateNote('${note.title}', '${note.body.replace(/'/g, "\'") || ''}')" class="text-xs text-blue-600 hover:underline">Duplicate</button>
            <button onclick="deleteNote('${note.key}')" class="text-xs text-red-600 hover:underline">Delete</button>
          </div>`;
        container.appendChild(div);
      }
    }

    async function loadNotes(prev = false) {
      const endpoint = `https://notes-worker.jgregorywalsh.workers.dev?limit=10${cursor && !prev ? `&cursor=${cursor}` : ''}`;
      const res = await fetch(endpoint);

      if (!res.ok) {
        document.getElementById('notesList').innerHTML = '<p class="text-red-600">Error loading notes.</p>';
        return;
      }

      const data = await res.json();
      notes = data.notes;
      renderNotes();

      if (prev && prevCursors.length > 1) prevCursors.pop();
      if (!prev) prevCursors.push(cursor);

      cursor = data.cursor;
      document.getElementById('prevBtn').disabled = prevCursors.length <= 1;
      document.getElementById('nextBtn').disabled = !data.cursor;
    }

    function setUser() {
      const jwt = document.cookie.split('; ').find(r => r.startsWith('CF_Authorization='))?.split('=')[1];
      if (!jwt) return;
      try {
        const payload = JSON.parse(atob(jwt.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
        document.getElementById('userEmail').textContent = payload.email;
      } catch {}
    }

    document.addEventListener('DOMContentLoaded', () => {
      setUser();
      const savedTitle = localStorage.getItem('noteDraftTitle');
      const savedBody = localStorage.getItem('noteDraftBody');
      if (savedTitle) document.getElementById('noteTitle').value = savedTitle;
      if (savedBody) document.getElementById('noteBody').value = savedBody;
      loadNotes();
    });
  </script>
</body>
</html>
