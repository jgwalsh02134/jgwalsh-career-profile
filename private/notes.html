<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secure Notes – J. Gregory Walsh</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; }
    .font-serif { font-family: 'DM Serif Display', serif; }
    .note-card { transition: all 0.3s ease; }
  </style>
</head>
<body class="text-slate-800">
  <div class="max-w-3xl mx-auto px-6 py-10">
    <header class="mb-8">
      <h1 class="text-3xl font-serif font-bold text-slate-900 mb-2">Secure Notes</h1>
      <p class="text-sm text-slate-700">Access granted to <code id="userEmail">loading...</code></p>
    </header>

    <section class="mb-6">
      <h2 class="text-lg font-semibold mb-2">New Note</h2>
      <input id="noteTitle" placeholder="Title" class="w-full border mb-2 px-3 py-2 rounded text-sm" />
      <textarea id="noteBody" placeholder="Body..." class="w-full border px-3 py-2 rounded text-sm h-32"></textarea>
      <button onclick="saveNote()" class="bg-slate-800 text-white px-4 py-2 rounded mt-2">Save Note</button>
      <p class="text-xs mt-1 text-slate-500">Notes are saved to secure Cloudflare KV storage. Session required.</p>
    </section>

    <section class="mb-6">
      <input oninput="filterNotes(this.value)" placeholder="Search notes..." class="w-full border px-3 py-2 rounded text-sm mb-4" />
      <h2 class="text-lg font-semibold mb-3">Saved Notes</h2>
      <div id="notesList" class="space-y-4 text-sm"></div>
    </section>

    <a href="/private/index.html" class="text-blue-700 hover:underline text-sm">&larr; Return to dashboard</a>
  </div>

  <script>
    const WORKER_ENDPOINT = 'https://notes-worker.jgregorywalsh.workers.dev';

    function parseJwtPayload(jwt) {
      try {
        const payload = jwt.split('.')[1];
        return JSON.parse(atob(payload.replace(/-/g, '+').replace(/_/g, '/')));
      } catch { return null; }
    }

    function setUser() {
      const jwt = document.cookie.split('; ').find(r => r.startsWith('CF_Authorization='))?.split('=')[1];
      const payload = parseJwtPayload(jwt);
      document.getElementById('userEmail').textContent = payload?.email || 'Authenticated user';
    }

    async function saveNote() {
      const title = document.getElementById('noteTitle').value.trim();
      const body = document.getElementById('noteBody').value.trim();
      if (!title || !body) return alert('Title and body are required.');

      const res = await fetch(WORKER_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, body })
      });
      if (res.ok) {
        document.getElementById('noteTitle').value = '';
        document.getElementById('noteBody').value = '';
        loadNotes();
      } else {
        alert('Failed to save note.');
      }
    }

    async function deleteNote(id) {
      if (!confirm('Delete this note?')) return;
      const res = await fetch(WORKER_ENDPOINT, {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id })
      });
      if (res.ok) loadNotes();
      else alert('Delete failed.');
    }

    async function loadNotes() {
      try {
        const res = await fetch(WORKER_ENDPOINT);
        const notes = await res.json();
        const container = document.getElementById('notesList');
        container.innerHTML = '';
        notes.forEach(({ id, title, body, timestamp }) => {
          const div = document.createElement('div');
          div.className = 'bg-white note-card border p-4 rounded shadow-sm';
          div.innerHTML = `
            <div class="flex justify-between items-start">
              <div>
                <p class="font-bold text-slate-900">${title}</p>
                <p class="text-slate-700 text-sm">${body}</p>
                <p class="text-slate-400 text-xs mt-1">${timestamp || ''}</p>
              </div>
              <button onclick="deleteNote('${id}')" class="text-red-600 text-xs ml-2">Delete</button>
            </div>
          `;
          container.appendChild(div);
        });
      } catch (err) {
        document.getElementById('notesList').innerHTML = '<p class="text-red-600">Error loading notes.</p>';
      }
    }

    function filterNotes(query) {
      document.querySelectorAll('.note-card').forEach(card => {
        card.style.display = card.textContent.toLowerCase().includes(query.toLowerCase()) ? '' : 'none';
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      setUser();
      loadNotes();
    });
  </script>
</body>
</html>
