<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Secure Notes – J. Gregory Walsh</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f9fafb; }
    .font-serif { font-family: 'DM Serif Display', serif; }
    .preview-area { @apply p-4 border border-slate-200 rounded bg-white mt-4 text-sm; }
  </style>
</head>
<body class="text-slate-800">
  <div class="max-w-2xl mx-auto px-6 py-12">
    <h1 class="text-3xl font-serif font-bold text-slate-900 mb-2">Secure Notes</h1>
    <p class="text-sm text-slate-600 mb-6">Access granted to <code id="userEmail">. . .</code></p>

    <!-- New Note Form -->
    <div class="bg-white border border-slate-200 rounded-lg p-6 shadow-sm mb-6">
      <h2 class="font-semibold mb-2">New Note</h2>
      <input id="noteTitle" class="w-full border border-slate-300 rounded px-3 py-2 mb-2 text-sm" placeholder="Title" />
      <textarea id="noteBody" class="w-full border border-slate-300 rounded px-3 py-2 text-sm h-32" placeholder="Body..."></textarea>
      <button id="togglePreview" class="mt-2 text-xs text-blue-700 hover:underline">↕ Show Preview</button>
      <div id="previewPanel" class="preview-area hidden text-slate-700 prose prose-sm"></div>
      <button id="saveNote" class="mt-4 bg-slate-800 text-white px-4 py-2 rounded hover:bg-slate-900 text-sm">Save Note</button>
      <p class="text-xs text-slate-500 mt-2">Notes are saved to secure Cloudflare KV storage. Session required.</p>
    </div>

    <!-- Search Input -->
    <input type="text" id="searchInput" placeholder="Search notes..." class="w-full border border-slate-300 rounded px-3 py-2 text-sm mb-4"/>

    <!-- Notes List -->
    <div id="notesList" class="space-y-4"></div>

    <p class="text-sm mt-8">
      <a href="/private/index.html" class="text-blue-700 hover:underline text-sm">&larr; Return to dashboard</a>
    </p>
  </div>

  <script>
    const emailSpan = document.getElementById('userEmail');
    const previewBtn = document.getElementById('togglePreview');
    const previewPanel = document.getElementById('previewPanel');
    const bodyInput = document.getElementById('noteBody');
    const searchInput = document.getElementById('searchInput');
    const notesList = document.getElementById('notesList');

    // Decode CF_Authorization JWT
    function parseJwtPayload(jwt) {
      try {
        const base64 = jwt.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
        const json = atob(base64);
        return JSON.parse(json);
      } catch { return null; }
    }

    // Get auth user
    function updateUserEmail() {
      const cookie = document.cookie.split('; ').find(c => c.startsWith('CF_Authorization='));
      if (!cookie) return;
      const jwt = cookie.split('=')[1];
      const payload = parseJwtPayload(jwt);
      if (payload?.email) emailSpan.textContent = payload.email;
    }

    // Toggle markdown preview
    previewBtn.addEventListener('click', () => {
      previewPanel.classList.toggle('hidden');
      previewBtn.textContent = previewPanel.classList.contains('hidden') ? '↕ Show Preview' : '↕ Hide Preview';
      previewPanel.innerHTML = marked.parse(bodyInput.value);
    });

    // Save note
    document.getElementById('saveNote').addEventListener('click', async () => {
      const title = document.getElementById('noteTitle').value.trim();
      const body = bodyInput.value.trim();
      if (!title || !body) return alert('Both title and body are required.');

      const res = await fetch('https://notes-worker.jgregorywalsh.workers.dev/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, body })
      });
      if (res.ok) location.reload();
      else alert('Error saving note.');
    });

    // Render one note
    function renderNote(note) {
      const div = document.createElement('div');
      div.className = 'bg-white border border-slate-200 rounded p-4 shadow-sm';
      div.innerHTML = `
        <h3 class="font-semibold mb-1">${note.title}</h3>
        <div class="text-sm text-slate-600 prose prose-sm">${marked.parse(note.body)}</div>
        <div class="mt-2 flex items-center justify-between text-xs text-slate-500">
          <span>${new Date(note.timestamp).toLocaleString()}</span>
          <div class="space-x-2">
            <button class="text-red-600 hover:underline" onclick="deleteNote('${note.key}')">Delete</button>
            <button class="text-blue-600 hover:underline" onclick="duplicateNote(${encodeURIComponent(JSON.stringify(note))})">Duplicate</button>
          </div>
        </div>`;
      return div;
    }

    // Load notes
    async function loadNotes() {
      const res = await fetch('https://notes-worker.jgregorywalsh.workers.dev/');
      const data = await res.json();
      const allNotes = data.notes || [];

      const render = () => {
        const search = searchInput.value.toLowerCase();
        notesList.innerHTML = '';
        allNotes.filter(n => n.title.toLowerCase().includes(search) || n.body.toLowerCase().includes(search))
          .forEach(n => notesList.appendChild(renderNote(n)));
      };
      searchInput.addEventListener('input', render);
      render();
    }

    // Delete note
    async function deleteNote(key) {
      if (!confirm('Delete this note?')) return;
      const res = await fetch(`https://notes-worker.jgregorywalsh.workers.dev/notes/${key}`, { method: 'DELETE' });
      if (res.ok) location.reload();
      else alert('Error deleting note.');
    }

    // Duplicate note
    function duplicateNote(encoded) {
      const note = JSON.parse(decodeURIComponent(encoded));
      document.getElementById('noteTitle').value = `(copy) ${note.title}`;
      document.getElementById('noteBody').value = note.body;
      previewPanel.innerHTML = '';
      previewPanel.classList.add('hidden');
      previewBtn.textContent = '↕ Show Preview';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Init
    updateUserEmail();
    loadNotes();
  </script>
</body>
</html>
