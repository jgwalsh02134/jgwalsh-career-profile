  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { navy: '#0F2A5F', sage: '#4b6e5d', ink: '#111317' },
          boxShadow: {
            card: '0 8px 24px rgba(0,0,0,.08), 0 2px 6px rgba(0,0,0,.06)',
            cardHover: '0 16px 32px rgba(0,0,0,.12), 0 4px 12px rgba(0,0,0,.10)'
          },
          borderRadius: { 'xl2': '1.1rem' },
          animation: { 'fade-in': 'fadeIn .7s ease-out both' },
          keyframes: {
            fadeIn: { '0%': {opacity:0, transform:'translateY(8px)'},
                      '100%': {opacity:1, transform:'translateY(0)'} }
          }
        },
        fontFamily: { sans: ['Inter','system-ui','Avenir','Helvetica','Arial','sans-serif'] }
      }
    }
  </script>
  <style>
    /* Minimal helpers (safe to keep here or move to style.css) */
    .card-img {
      aspect-ratio: 16/9;
      width: 100%; height: auto; object-fit: cover; display: block;
    }
    .card-clip { border-radius: 14px; overflow: hidden; }
    .card { background: var(--card-bg, #fff); }
    .card:hover .img-overlay { opacity: .08; }
    .img-overlay { position: absolute; inset: 0; background: linear-gradient(to bottom, transparent, rgba(0,0,0,.28)); opacity: .05; transition: opacity .2s ease; }
    .tag {
      font: 600 12px/1.2 Inter, sans-serif; padding: 6px 10px; border-radius: 999px;
      background: rgba(15,42,95,.06); color:#0F2A5F; border:1px solid rgba(15,42,95,.12);
    }
    @media (prefers-color-scheme: dark) {
      .tag { background: rgba(255,255,255,.06); color:#e8e8e8; border-color: rgba(255,255,255,.14); }
    }
    .focus-ring { outline: 0; box-shadow: 0 0 0 2px #fff, 0 0 0 4px #0F2A5F; }
    @media (prefers-color-scheme: dark) { .focus-ring { box-shadow: 0 0 0 2px #0F2A5F, 0 0 0 4px #e8e8e8; } }
    .list-card .card-img { aspect-ratio: 3/2; max-width: 320px; }
  </style>

  <!-- OpenGraph (optional) -->
  <meta property="og:title" content="Projects & Portfolio – James Gregory Walsh" />
  <meta property="og:description" content="Selected work across analysis, visualization, and psych+tech." />
  <meta property="og:url" content="https://jgwalsh.com/projects" />
  <meta property="og:image" content="https://jgwalsh.com/assets/favicon/favicon-192.png" />

<body class="bg-gray-50 text-gray-800 dark:bg-slate-900 dark:text-slate-200 antialiased leading-relaxed flex flex-col min-h-screen">

  <!-- Header -->
  <header class="bg-gray-50 dark:bg-slate-900 shadow-sm sticky top-0 w-full z-50">
    <div class="max-w-6xl mx-auto px-4 py-5 flex justify-between items-center">
      <a href="/index.html" class="text-2xl font-semibold text-navy">James Gregory Walsh</a>
      <div class="sm:hidden">
        <button onclick="toggleMenu()" class="text-gray-800 focus:outline-none focus:ring-2 focus:ring-sage rounded px-2 py-1" aria-controls="mobile-menu" aria-expanded="false">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"/></svg>
          <span class="sr-only">Toggle menu</span>

      </div>
      <nav class="hidden sm:flex items-center gap-6 text-sm text-slate-700" role="navigation" aria-label="Main">
        <a href="/index.html" class="hover:text-navy focus:outline-none focus:ring-2 focus:ring-sage rounded px-2 py-1">Home</a>
        <a href="/about.html" class="hover:text-navy focus:outline-none focus:ring-2 focus:ring-sage rounded px-2 py-1">About</a>
        <a href="/resume.html" class="hover:text-navy focus:outline-none focus:ring-2 focus:ring-sage rounded px-2 py-1">Résumé</a>
        <a href="/projects/" class="hover:text-navy focus:outline-none focus:ring-2 focus:ring-sage rounded px-2 py-1 font-bold text-navy" aria-current="page">Projects</a>
        <a href="/contact.html" class="hover:text-navy focus:outline-none focus:ring-2 focus:ring-sage rounded px-2 py-1">Contact</a>

        </button>

    </div>
    <div id="mobile-menu" class="sm:hidden hidden px-4 pb-4 text-slate-700" role="navigation" aria-label="Mobile">
      <a href="/index.html" class="block py-2 text-sm hover:text-navy focus:outline-none focus:ring-2 focus:ring-sage rounded">Home</a>
      <a href="/about.html" class="block py-2 text-sm hover:text-navy focus:outline-none focus:ring-2 focus:ring-sage rounded">About</a>
      <a href="/resume.html" class="block py-2 text-sm hover:text-navy focus:outline-none focus:ring-2 focus:ring-sage rounded">Résumé</a>
      <a href="/projects/" class="block py-2 text-sm hover:text-navy focus:outline-none focus:ring-2 focus:ring-sage rounded font-bold text-navy" aria-current="page">Projects</a>
      <a href="/contact.html" class="block py-2 text-sm hover:text-navy focus:outline-none focus:ring-2 focus:ring-sage rounded">Contact</a>

  <main id="main" class="max-w-6xl mx-auto py-10 sm:py-14 px-4 flex-grow w-full" itemscope itemtype="https://schema.org/ItemList">
    <meta itemprop="itemListOrder" content="https://schema.org/ItemListOrderAscending" />
    <meta itemprop="name" content="Projects" />

    <!-- Title + Controls -->
    <section class="mb-6 sm:mb-8 flex flex-col gap-4 md:flex-row md:items-end md:justify-between">
      <div>
        <h1 class="text-3xl sm:text-4xl font-bold text-navy">Projects</h1>
        <p class="text-base text-slate-600 dark:text-slate-400 mt-2">A curated set of analysis, visualization, and psych+tech work.</p>
      </div>
      <div class="flex flex-wrap items-center gap-3">
        <div class="flex gap-2" role="toolbar" aria-label="Layout">
          <button id="gridBtn" class="px-3 py-1.5 rounded border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm font-semibold" aria-pressed="true">Grid</button>
          <button id="listBtn" class="px-3 py-1.5 rounded border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm">List</button>
        </div>
        <div class="flex gap-2">
          <label class="sr-only" for="sort">Sort</label>
          <select id="sort" class="px-3 py-1.5 rounded border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm">
            <option value="recent" selected>Most Recent</option>
            <option value="alpha">A → Z</option>
          </select>
        </div>
      </div>
    </section>

    <!-- Search + Filter pills -->
    <section class="mb-6">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
        <label for="search" class="sr-only">Search projects</label>
        <input id="search" type="search" placeholder="Search projects…" class="w-full md:w-80 px-3 py-2 rounded border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-sage" aria-describedby="results-count" />
        <div id="filters" class="flex flex-wrap gap-2" role="toolbar" aria-label="Filters">
          <button class="filter-pill px-3 py-1.5 rounded-full text-sm bg-navy text-white" data-filter="all" aria-pressed="true">All</button>
          <button class="filter-pill px-3 py-1.5 rounded-full text-sm bg-slate-200 dark:bg-slate-800" data-filter="research" aria-pressed="false">Research</button>
          <button class="filter-pill px-3 py-1.5 rounded-full text-sm bg-slate-200 dark:bg-slate-800" data-filter="open-source" aria-pressed="false">Open Source</button>
          <button class="filter-pill px-3 py-1.5 rounded-full text-sm bg-slate-200 dark:bg-slate-800" data-filter="visualization" aria-pressed="false">Visualization</button>
          <button class="filter-pill px-3 py-1.5 rounded-full text-sm bg-slate-200 dark:bg-slate-800" data-filter="psych-tech" aria-pressed="false">Psych + Tech</button>
        </div>
      </div>
      <div id="results-count" class="mt-2 text-sm text-slate-600 dark:text-slate-400" aria-live="polite">Showing 0 projects</div>
    </section>

    <!-- Grid/List container -->
    <div id="projectsGrid" class="grid gap-8 grid-cols-1 md:grid-cols-2 lg:grid-cols-3 animate-fade-in"></div>
  </main>

  <!-- GPT buttons -->
  <section class="gpt-links" aria-label="Custom GPTs">
    <a href="https://chatgpt.com/g/g-6885b0c65ea88191a9727465b8fe4b3e-investigator-gpt" class="gpt-button" target="_blank" rel="noopener">
      <img src="/assets/icons/b&w-chatgpt-2.svg" alt="Investigator GPT icon" class="gpt-icon" />
      <span>Investigator GPT</span>

  </section>

  <!-- Footer -->
  <footer class="bg-gray-100 dark:bg-slate-950 text-sm text-gray-600 dark:text-slate-400 border-t pt-8 pb-6 px-4 mt-auto">
    <div class="max-w-4xl mx-auto text-center space-y-4">
      <div class="text-navy">© 2025 James Gregory Walsh — All rights reserved.</div>
      <div class="flex justify-center items-center gap-3">
        <a href="mailto:jgwalsh@proton.me" class="text-navy hover:underline">Email</a>
        <span>·</span>
        <a href="https://github.com/jgwalsh02134" target="_blank" rel="noopener" class="inline-flex items-center gap-1 text-navy hover:underline">GitHub</a>
        <span>·</span>
        <a href="/contact.html" class="text-navy hover:underline">Contact</a>
      </div>
    </div>

  <script>
    function toggleMenu() {
      const menu = document.getElementById('mobile-menu');
      menu.classList.toggle('hidden');
      menu.setAttribute('aria-expanded', !menu.classList.contains('hidden'));
    }

    // Data for cards (centralize so grid & list share one source)
    const PROJECTS = [
      {
        title: "Interactive Projects Gallery",
        href: "/projects-folder/index.html",
        img: "/assets/images/interactive-project-gal-2.png",
        date: "2025-08-20",
        tags: ["visualization","open-source"],
        blurb: "Prototypes and POCs collected in one place."
      },
      {
        title: "Project Source Code & Contributions",
        href: "https://github.com/jgwalsh02134",
        img: "/assets/images/source-code-project-card.png",
        date: "2025-07-10",
        tags: ["open-source","research"],
        blurb: "Website source and other public repos.",
        external: true
      },
      {
        title: "Psyber Nexus",
        href: "/projects/psyber-nexus/",
        img: "/assets/images/psyber-nexus-project-card-3.png?v=3",
        date: "2025-08-10",
        tags: ["psych-tech","research"],
        blurb: "Research at the intersection of psychology and technology."
      },
      {
        title: "Crime Analysis Report: Albany, NY (2021–2024)",
        href: "/projects/albany-crime-dashboard/",
        img: "/assets/images/alb-crime-analysis-image-2.png",
        date: "2025-03-21",
        tags: ["research","visualization"],
        blurb: "Trends across total crime, violent categories, neighborhood distribution, and case resolution."
      },
      {
        title: "AdSell.ai & Vision Data — Marketing Plan",
        href: "https://notes.jgwalsh.com",
        img: "/assets/images/notes-project-card-image.png?v=2",
        date: "2025-06-18",
        tags: ["psych-tech","open-source"],
        blurb: "Central planning hub and notes.",
        external: true
      },
      {
        title: "Resource Center",
        href: "/resources/",
        img: "/assets/images/psyber-nexus-project-card-3.png?v=3",
        date: "2025-08-24",
        tags: ["open-source","resources"],
        blurb: "Password-protected hub for PDFs, docs, notes, datasets."
      }
    ];

    // Utilities
    const qs   = (s, el=document) => el.querySelector(s);
    const qsa  = (s, el=document) => [...el.querySelectorAll(s)];
    const norm = (s) => (s||'').toLowerCase();
    const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // Renderers
    function projectCard(p, index, listMode=false){
      // srcset/sizes for perf
      const srcset = `${p.img} 640w, ${p.img} 960w, ${p.img} 1280w`;
      const sizes  = "(max-width: 640px) 100vw, (max-width: 1024px) 50vw, 33vw";

      const badgeHTML = p.tags.slice(0,3).map(t => `<span class="tag">${t}</span>`).join(' ');

      if (!listMode) {
        return `
        <article class="card relative card-clip bg-white dark:bg-slate-800 shadow-card hover:shadow-cardHover transition will-change-transform focus-within:ring-2 focus-within:ring-sage"
                 data-title="${p.title}" data-tags="${p.tags.join(',')}" itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem">
          <meta itemprop="position" content="${index+1}" />
          <img class="card-img" src="${p.img}" srcset="${srcset}" sizes="${sizes}" alt="${p.title}" loading="lazy" decoding="async" itemprop="image">
          <div class="img-overlay" aria-hidden="true"></div>
          <div class="p-6 sm:p-7 flex flex-col gap-3">
            <h2 class="text-xl sm:text-2xl font-bold text-navy" itemprop="name">${p.title}</h2>
            <p class="text-sm text-slate-500">${new Date(p.date).toLocaleDateString()}</p>
            <p class="text-slate-700 dark:text-slate-300">${p.blurb}</p>
            <div class="flex flex-wrap gap-2 mt-1">${badgeHTML}</div>
            <div class="mt-4">
              <a href="${p.href}" ${p.external?'target="_blank" rel="noopener"':''}
                 class="inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-navy text-white hover:bg-navy/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-navy">
                ${p.external ? 'Open Link' : 'View Project'}
              </a>
            </div>
          </div>
          <a href="${p.href}" ${p.external?'target="_blank" rel="noopener"':''} class="absolute inset-0 z-10" aria-label="${p.title}"></a>
        </article>`;
      }

      // list mode
      return `
      <article class="list-card card relative bg-white dark:bg-slate-800 rounded-xl2 shadow-card hover:shadow-cardHover transition p-4 sm:p-5 flex gap-4 items-start"
               data-title="${p.title}" data-tags="${p.tags.join(',')}" itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem">
        <meta itemprop="position" content="${index+1}" />
        <img class="card-img rounded-xl2" src="${p.img}" srcset="${srcset}" sizes="(max-width: 640px) 100vw, 320px" alt="${p.title}" loading="lazy" decoding="async" itemprop="image" style="max-width:320px;">
        <div class="flex-1 min-w-0">
          <h2 class="text-lg sm:text-xl font-bold text-navy" itemprop="name">${p.title}</h2>
          <p class="text-sm text-slate-500">${new Date(p.date).toLocaleDateString()}</p>
          <p class="mt-2 text-slate-700 dark:text-slate-300">${p.blurb}</p>
          <div class="flex flex-wrap gap-2 mt-2">${badgeHTML}</div>
          <div class="mt-3">
            <a href="${p.href}" ${p.external?'target="_blank" rel="noopener"':''}
               class="inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-navy text-white hover:bg-navy/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-navy">Open</a>
          </div>
        </div>
        <a href="${p.href}" ${p.external?'target="_blank" rel="noopener"':''} class="absolute inset-0 z-10" aria-label="${p.title}"></a>
      </article>`;
    }

    function render(listMode=false) {
      const wrap = document.getElementById('projectsGrid');
      wrap.className = listMode
        ? "grid gap-5 grid-cols-1 animate-fade-in"
        : "grid gap-8 grid-cols-1 md:grid-cols-2 lg:grid-cols-3 animate-fade-in";
      wrap.innerHTML = PROJECTS.map((p,i)=>projectCard(p,i,listMode)).join('');
      if (!prefersReduced) observeReveal();
      applyFilters(); // reapply after re-render (layout switch)
    }

    // Search / Filter / Sort with query-string persistence
    const searchEl = document.getElementById('search');
    const countEl  = document.getElementById('results-count');
    const pills    = qsa('.filter-pill');
    const sortEl   = document.getElementById('sort');
    const gridBtn  = document.getElementById('gridBtn');
    const listBtn  = document.getElementById('listBtn');

    function setQS(params) {
      const url = new URL(location.href);
      Object.entries(params).forEach(([k,v]) => (v==null || v==='') ? url.searchParams.delete(k) : url.searchParams.set(k,v));
      history.replaceState(null,'',url);
    }
    function getQS() {
      const sp = new URLSearchParams(location.search);
      return { q: sp.get('q')||'', f: sp.get('f')||'all', s: sp.get('s')||'recent', mode: sp.get('mode')||'grid' };
    }

    function applyFilters(){
      const term = norm(searchEl.value);
      const active = pills.find(p=>p.getAttribute('aria-pressed')==='true');
      const filter = active ? active.getAttribute('data-filter') : 'all';
      // sort
      const mode = sortEl.value;
      PROJECTS.sort((a,b)=>{
        if (mode==='alpha') return a.title.localeCompare(b.title);
        // recent default
        return new Date(b.date) - new Date(a.date);
      });
      // filter + search
      const cards = qsa('#projectsGrid article');
      let visible = 0;
      cards.forEach(card=>{
        const title = norm(card.getAttribute('data-title'));
        const tags  = norm(card.getAttribute('data-tags'));
        const matchesTerm = !term || title.includes(term) || tags.includes(term);
        const matchesFilter = filter==='all' || tags.split(',').includes(filter);
        const show = matchesTerm && matchesFilter;
        card.style.display = show ? '' : 'none';
        if (show) visible++;
      });
      if (countEl) countEl.textContent = `Showing ${visible} project${visible===1?'':'s'}`;
      setQS({ q: term or null, f: filter, s: sortEl.value, mode: gridBtn.getAttribute('aria-pressed')==='true' ? 'grid' : 'list' });
    }

    // Event wiring
    pills.forEach(pill => pill.addEventListener('click', () => {
      pills.forEach(p => { p.setAttribute('aria-pressed','false'); p.classList.remove('bg-navy','text-white'); p.classList.add('bg-slate-200','dark:bg-slate-800'); });
      pill.setAttribute('aria-pressed','true'); pill.classList.add('bg-navy','text-white'); pill.classList.remove('bg-slate-200');
      applyFilters();
    }));
    searchEl.addEventListener('input', () => { applyFilters(); });
    sortEl.addEventListener('change', () => { applyFilters(); });

    gridBtn.addEventListener('click', () => {
      gridBtn.setAttribute('aria-pressed','true'); listBtn.setAttribute('aria-pressed','false');
      render(false);
    });
    listBtn.addEventListener('click', () => {
      gridBtn.setAttribute('aria-pressed','false'); listBtn.setAttribute('aria-pressed','true');
      render(true);
    });

    // Reveal on scroll (reduced-motion aware)
    function observeReveal(){
      const obs = new IntersectionObserver((entries)=>{
        entries.forEach(e=>{
          if (e.isIntersecting) {
            e.target.style.transition = 'transform .35s ease, opacity .35s ease';
            e.target.style.transform = 'translateY(0)';
            e.target.style.opacity = '1';
            obs.unobserve(e.target);
          }
        });
      }, { rootMargin: '80px 0px' });
      qsa('#projectsGrid article').forEach(card=>{
        card.style.transform = 'translateY(8px)';
        card.style.opacity = '.001';
        obs.observe(card);
      });
    }

    // Initialize with QS state
    (function init(){
      const { q, f, s, mode } = getQS();
      if (q) searchEl.value = q;
      sortEl.value = s;
      pills.forEach(p => {
        const on = p.getAttribute('data-filter') === f;
        p.setAttribute('aria-pressed', on ? 'true' : 'false');
        p.classList.toggle('bg-navy', on);
        p.classList.toggle('text-white', on);
        if (!on) p.classList.add('bg-slate-200','dark:bg-slate-800');
      });
      if (mode === 'list') { listBtn.click(); } else { gridBtn.click(); }
      applyFilters();
    })();
  </script>
</body>
</html>
