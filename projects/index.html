  <!-- Enhanced Projects (projects-pro) Section -->
  <section class="projects-pro" aria-labelledby="pp-heading">
    <h2 id="pp-heading" class="visually-hidden">Projects (Enhanced)</h2>
    <nav class="home-link" aria-label="Breadcrumb" style="margin:.75rem 0 1.25rem;">
      <a href="/"
        style="text-decoration:none;border:1px solid rgba(0,0,0,.15);padding:.45rem .75rem;border-radius:10px;display:inline-block;">←
        Home</a>
    </nav>
    <div class="pp-actions" role="region" aria-label="Project controls">
      <div class="pp-searchwrap">
        <input id="pp-search" class="pp-input" type="search" placeholder="Search projects…" aria-label="Search projects" />
        <button id="pp-search-go" class="pp-btn" type="button" aria-label="Run search">Enter</button>
      </div>

      <label for="pp-sort" class="sr-only">Sort</label>
      <select id="pp-sort" class="pp-select" aria-label="Sort projects">
        <option value="newest">Newest</option>
        <option value="oldest">Oldest</option>
        <option value="az">A → Z</option>
      </select>

      <div class="pp-view" role="group" aria-label="View mode">
        <button id="pp-view-grid" class="pp-btn is-active" data-view="grid" aria-pressed="true">Grid</button>
        <button id="pp-view-list" class="pp-btn" data-view="list" aria-pressed="false">List</button>
      </div>
    </div>
    <div id="pp-results" class="pp-grid" role="list" aria-live="polite" aria-busy="true"></div>
    <!-- Card template used by renderer -->
    <template id="pp-card">
      <article class="pp-card" role="listitem" data-project-card>
        <a class="pp-thumb" target="_self" rel="noopener"><img class="pp-thumb-img" alt="" loading="lazy" decoding="async" /></a>
        <div class="pp-body">
          <div class="pp-top">
            <h3 class="pp-title"><a class="pp-link" target="_self" rel="noopener"></a></h3>
            <div class="pp-meta">
              <button class="pp-icon pp-fav" title="Favorite" aria-pressed="false" aria-label="Toggle favorite">
                <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                  <path class="pp-star"
                    d="M12 .587l3.668 7.568L24 9.75l-6 5.854 1.416 8.264L12 19.771l-7.416 4.097L6 15.604 0 9.75l8.332-1.595z" />
                </svg>
              </button>
              <button class="pp-icon pp-share" title="Copy link" aria-label="Copy link">Copy</button>
            </div>
          </div>
          <p class="pp-desc"></p>
          <ul class="pp-tagsline" aria-label="Tags"></ul>
        </div>
      </article>
    </template>

    <!-- inline fallback (keep []) — external JSON is primary -->
    <script type="application/json" id="pp-data">[]</script>

    <!-- Renderer moved to external module to avoid TS HTML Problems -->
    <script type="module">
      import initProjectsGallery from "/assets/js/projects-gallery.js?v=proj_fix4";
