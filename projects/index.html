<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Projects & Portfolio — James Gregory Walsh</title>
  <meta name="description"
    content="A selection of projects demonstrating analysis, research, visualization, and psych-tech initiatives.">
  <link rel="canonical" href="/projects/">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="/assets/css/style.css?v=proj2">
  <link rel="stylesheet" href="/assets/css/projects.css?v=proj2">
</head>

<body style="background:var(--bg); color:var(--text);">
  <header class="site-header" role="banner"
    style="background:#f8fafc;border-bottom:1px solid rgba(0,0,0,.08);padding:.6rem 1rem">
    <nav aria-label="Main">
      <a href="/">Home</a>
      <a href="/about.html">About</a>
      <a href="/resume.html">Résumé</a>
      <a href="/projects/" aria-current="page" class="font-bold text-navy">Projects</a>
      <a href="/contact.html">Contact</a>
      <button id="theme-toggle" type="button" aria-label="Toggle theme" aria-pressed="false">Theme</button>
    </nav>
  </header>
  <main class="page-wrap" id="projects-app">
    <header class="header" aria-labelledby="title">
      <h1 id="title">Projects & Portfolio</h1>
      <p>A selection of projects demonstrating analysis, research, visualization, and psych-tech initiatives.</p>
    </header>
  </main>

  <!-- Enhanced Projects (projects-pro) Section -->
  <section class="projects-pro" aria-labelledby="pp-heading">
    <h2 id="pp-heading" class="visually-hidden">Projects (Enhanced)</h2>
    <nav class="home-link" aria-label="Breadcrumb" style="margin:.75rem 0 1.25rem;">
      <a href="/"
        style="text-decoration:none;border:1px solid rgba(0,0,0,.15);padding:.45rem .75rem;border-radius:10px;display:inline-block;">←
        Home</a>
    </nav>
    <div class="pp-controls" role="group" aria-label="Project filters and search">
      <div class="pp-search">
        <input id="pp-search" type="search" placeholder="Search…" autocomplete="off" aria-label="Search projects">
      </div>
      <div class="pp-sort">
        <label for="pp-sort" class="visually-hidden">Sort</label>
        <select id="pp-sort" aria-label="Sort projects">
          <option value="newest" selected>Newest</option>
          <option value="oldest">Oldest</option>
          <option value="az">A–Z</option>
        </select>
      </div>
      <div class="pp-tags" aria-label="Tag filters"></div>
    </div>
    <div id="pp-results" class="pp-grid" role="list" aria-live="polite"></div>

    <!-- Inline dataset fallback (used if external fetch fails) -->
    <script type="application/json" id="pp-data">[]</script>

    <!-- Card template used by renderer -->
    <template id="pp-card">
      <article class="pp-card" role="listitem" data-project-card>
        <a class="pp-thumb" target="_self" rel="noopener" aria-label="Open project">
          <img class="pp-thumb-img" alt="" loading="lazy" decoding="async" />
        </a>
        <div class="pp-body">
          <div class="pp-top">
            <h3 class="pp-title"><a class="pp-link" target="_self" rel="noopener"></a></h3>
            <div class="pp-meta">
              <button class="pp-icon pp-fav" title="Favorite" aria-pressed="false" aria-label="Toggle favorite">
                <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                  <path class="pp-star"
                    d="M12 .587l3.668 7.568L24 9.75l-6 5.854 1.416 8.264L12 19.771l-7.416 4.097L6 15.604 0 9.75l8.332-1.595z" />
                </svg>
              </button>
              <button class="pp-icon pp-share" title="Copy link" aria-label="Copy link">Copy</button>
            </div>
          </div>
          <p class="pp-desc"></p>
          <ul class="pp-tagsline" aria-label="Tags"></ul>
        </div>
      </article>
    </template>

    <!-- Renderer moved to external module to avoid TS HTML Problems -->
    <script type="module">
      import initProjectsGallery from "/assets/js/projects-gallery.js?v=proj2";
      initProjectsGallery;
    </script>
  </section>
  <!-- /Enhanced Projects Section -->
</body>

<section class="gpt-links" aria-label="Custom GPTs">
  <a href="https://chatgpt.com/g/g-6885b0c65ea88191a9727465b8fe4b3e-investigator-gpt" class="gpt-button" target="_blank"
    rel="noopener noreferrer">
    <img src="/assets/icons/b&w-chatgpt-2.svg" alt="Investigator GPT icon" class="gpt-icon" />
    <span>Investigator GPT</span>
  </a>
</section>

</html>
