<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secure Notes – J. Gregory Walsh</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; }
    .font-serif { font-family: 'DM Serif Display', serif; }
    .note-body { white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body class="text-slate-800">
  <div class="max-w-3xl mx-auto px-6 py-10">
    <header class="mb-8">
      <h1 class="text-3xl font-serif font-bold text-slate-900 mb-2">Secure Notes</h1>
      <p class="text-sm text-slate-700">Access granted to <code id="userEmail">...</code></p>
    </header>

    <main>
      <section class="bg-white border border-slate-200 rounded-lg p-6 shadow-sm mb-8">
        <h2 class="text-lg font-semibold font-serif mb-4 text-slate-800">New Note</h2>
        <form id="noteForm" class="space-y-3">
          <input id="noteTitle" type="text" placeholder="Title" class="w-full border border-slate-300 rounded p-2 text-sm" required />
          <textarea id="noteBody" placeholder="Body..." class="w-full border border-slate-300 rounded p-2 text-sm h-32" required></textarea>
          <button type="submit" class="bg-slate-800 text-white px-4 py-2 rounded hover:bg-slate-900">Save Note</button>
        </form>
        <p class="mt-3 text-xs text-slate-500">Notes are saved to secure Cloudflare KV storage. Session required.</p>
      </section>

      <section class="mb-10">
        <h2 class="text-lg font-semibold font-serif mb-2 text-slate-800">Saved Notes</h2>
        <div id="notesContainer" class="space-y-4 text-sm"></div>
      </section>

      <section class="text-sm text-slate-600 border-t pt-6">
        <a href="/private/index.html" class="text-blue-700 hover:underline font-medium">&larr; Return to dashboard</a>
      </section>
    </main>
  </div>

  <script>
    function parseJwtPayload(jwt) {
      try {
        const payload = jwt.split('.')[1];
        const decodedPayload = atob(payload.replace(/-/g, '+').replace(/_/g, '/'));
        return JSON.parse(decodedPayload);
      } catch { return null; }
    }

    async function loadNotes() {
      const container = document.getElementById('notesContainer');
      container.innerHTML = 'Loading...';
      try {
        const res = await fetch('https://notes-worker.jgregorywalsh.workers.dev');
        const data = await res.json();
        container.innerHTML = '';

        data.notes.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
        data.notes.forEach(note => {
          const div = document.createElement('div');
          div.className = 'bg-white border border-slate-200 rounded p-4 shadow-sm';
          div.innerHTML = `
            <h3 class="font-semibold mb-1">${note.title}</h3>
            <div class="note-body text-slate-700 mb-1">${marked.parse(note.body)}</div>
            <div class="text-xs text-slate-400">${new Date(note.timestamp).toLocaleString()}</div>
          `;
          container.appendChild(div);
        });
      } catch (err) {
        container.innerHTML = '<p class="text-red-600">Error loading notes.</p>';
      }
    }

    document.getElementById('noteForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('noteTitle').value.trim();
      const body = document.getElementById('noteBody').value.trim();

      try {
        const res = await fetch('https://notes-worker.jgregorywalsh.workers.dev', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, body })
        });

        if (res.ok) {
          document.getElementById('noteForm').reset();
          loadNotes();
        } else {
          alert('Error saving note.');
        }
      } catch {
        alert('Error connecting to worker.');
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      const jwt = document.cookie.split('; ').find(row => row.startsWith('CF_Authorization='))?.split('=')[1];
      const payload = parseJwtPayload(jwt);
      document.getElementById('userEmail').textContent = payload?.email || 'Authenticated user';
      loadNotes();
    });
  </script>
</body>
</html>
