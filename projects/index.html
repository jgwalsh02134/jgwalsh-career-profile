<body style="background:var(--bg); color:var(--text);">
  <header class="bg-gray-50 dark:bg-slate-900 shadow-sm sticky top-0 w-full z-50 header-wrap">

      <div class="sm:hidden">
        <button id="mobile-menu-button"
          class="text-gray-800 focus:outline-none focus:ring-2 focus:ring-sage rounded px-2 py-1"
          aria-controls="mobile-menu" aria-expanded="false" aria-label="Toggle menu">&#9776;</button>
      </div>

        <a href="/" class="hover:text-navy px-2 py-1 rounded">Home</a>

          aria-current="page">Projects</a>
        <a href="/contact.html" class="hover:text-navy px-2 py-1 rounded">Contact</a>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch theme"
          aria-pressed="false"><span class="switch__track" aria-hidden="true"><span
              class="switch__thumb"></span></span></button>
      </nav>
    </div>
    <div id="mobile-menu" class="sm:hidden hidden px-4 pb-4 text-slate-700" aria-label="Mobile navigation">
      <a href="/" class="block py-2 text-sm hover:text-navy rounded">Home</a>
      <a href="/about.html" class="block py-2 text-sm hover:text-navy rounded">About</a>
      <a href="/resume.html" class="block py-2 text-sm hover:text-navy rounded">Résumé</a>
      <a href="/projects/" class="block py-2 text-sm hover:text-navy rounded font-bold text-navy"
        aria-current="page">Projects</a>
      <a href="/contact.html" class="block py-2 text-sm hover:text-navy rounded">Contact</a>
      <button id="theme-toggle-mobile" class="mt-2 w-full px-3 py-2 rounded border text-left theme-toggle" type="button"
        aria-pressed="false" aria-label="Switch theme"><span class="switch__track" aria-hidden="true"><span
            class="switch__thumb"></span></span></button>
    </div>
  </header>

  <main class="container safe-pad" id="main-content" style="padding-block:1.25rem 2rem;">
    <!-- Enhanced Projects (projects-pro) Section -->
    <section class="projects-pro" aria-labelledby="pp-heading">
      <h2 id="pp-heading" class="visually-hidden">Projects</h2>
      <div class="pp-actions" role="region" aria-label="Project controls">
        <div class="pp-searchwrap">
          <input id="pp-search" type="search" placeholder="Search projects…" aria-label="Search projects" />
          <button id="pp-search-go" type="button">Enter</button>
        </div>
        <select id="pp-sort" aria-label="Sort projects">
          <option value="newest">Newest</option>
          <option value="oldest">Oldest</option>
          <option value="az">A → Z</option>
        </select>
        <div class="pp-view" role="group" aria-label="View mode">
          <button id="pp-view-grid" data-view="grid" aria-pressed="true">Grid</button>
          <button id="pp-view-list" data-view="list" aria-pressed="false">List</button>
        </div>
      </div>
      <div id="pp-results" class="pp-grid" role="list" aria-live="polite" aria-busy="true"></div>
      <template id="pp-card">
        <article class="pp-card" role="listitem" data-project-card>
          <a class="pp-thumb" target="_self" rel="noopener">
            <img class="pp-thumb-img" alt="" loading="lazy" decoding="async" />
          </a>
          <div class="pp-body">
            <h3 class="pp-title"><a class="pp-link" target="_self" rel="noopener"></a></h3>
            <p class="pp-desc"></p>
            <ul class="pp-tagsline" aria-label="Tags"></ul>
          </div>
        </article>
      </template>
      <script type="application/json" id="pp-data">[]</script>

      <section class="cta-group" aria-label="Quick links">
        <a class="cta-item tile" href="https://notes.jgwalsh.com/" target="_blank" rel="noopener">
          <img src="/assets/icons/notes-icon-1.svg" alt="" aria-hidden="true">
          <span class="cta-label">Notes</span>
        </a>
        <a class="cta-item tile" href="https://chatgpt.com/g/g-6885b0c65ea88191a9727465b8fe4b3e-investigator-gpt"
          target="_blank" rel="noopener">
          <img src="/assets/icons/b&w-chatgpt-2.svg" alt="" aria-hidden="true">
          <span class="cta-label">Investigator GPT</span>
        </a>
        <a class="cta-item tile" href="https://github.com/jgwalsh02134/jgwalsh-career-profile" target="_blank"
          rel="noopener">
          <img src="/assets/icons/github-profile-pic.svg" alt="" aria-hidden="true">
          <span class="cta-label">GitHub Profile</span>
        </a>
        <a class="cta-item tile" href="https://dash.cloudflare.com/" target="_blank" rel="noopener">
          <img src="/assets/icons/icons8-cloudflare.svg" alt="" aria-hidden="true">
          <span class="cta-label">Cloudflare Dash</span>
        </a>
        <a class="cta-item tile" href="https://developer.apple.com/" target="_blank" rel="noopener">
          <img src="/assets/icons/icons8-mac-os-2.svg" alt="" aria-hidden="true">
          <span class="cta-label"> Developer</span>
        </a>
      </section>

      <script type="module" src="/assets/js/projects-gallery.js?v=proj_rescue2"></script>
    </section>
    <!-- /Enhanced Projects Section -->
  </main>

  <footer
    class="site-footer bg-gray-100 dark:bg-slate-950 text-sm text-gray-600 dark:text-slate-400 border-t pt-8 pb-6 px-4 mt-auto">
    <div class="max-w-4xl mx-auto text-center space-y-4">
      <div class="text-navy">© 2025 James Gregory Walsh — All rights reserved.</div>
      <div class="flex justify-center items-center gap-3">
        <a href="mailto:jgwalsh@proton.me"
          class="text-navy hover:underline focus:outline-none focus:ring-2 focus:ring-sage rounded px-1 py-0.5">Email</a>
        <span>·</span>
        <a href="https://github.com/jgwalsh02134" target="_blank" rel="noopener"
          class="inline-flex items-center gap-1 text-navy hover:underline focus:outline-none focus:ring-2 focus:ring-sage rounded px-1 py-0.5"
          aria-label="GitHub profile (opens in new tab)">

              clip-rule="evenodd" />
          </svg>
          GitHub
        </a>
        <span>·</span>
        <a href="/contact.html"
          class="text-navy hover:underline focus:outline-none focus:ring-2 focus:ring-sage rounded px-1 py-0.5">Contact</a>
      </div>
    </div>
  </footer>
  <script>
    (function navMenu() {
      const btn = document.getElementById('mobile-menu-button');
      const menu = document.getElementById('mobile-menu');
      if (!btn || !menu) return;
      btn.addEventListener('click', () => {
        const open = !menu.classList.toggle('hidden');
        btn.setAttribute('aria-expanded', String(open));
      });
    })();
  </script>
</body>

</html>
