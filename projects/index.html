      <div class="sm:hidden">
        <button id="mobile-menu-button" class="text-gray-800 focus:outline-none focus:ring-2 focus:ring-sage rounded px-2 py-1" aria-controls="mobile-menu" aria-expanded="false" aria-label="Toggle menu">&#9776;</button>

    </div>
    <div id="mobile-menu" class="sm:hidden hidden px-4 pb-4 text-slate-700" aria-label="Mobile navigation">
      <a href="/" class="block py-2 text-sm hover:text-navy rounded">Home</a>
      <a href="/about.html" class="block py-2 text-sm hover:text-navy rounded">About</a>
      <a href="/resume.html" class="block py-2 text-sm hover:text-navy rounded">Résumé</a>

      <button id="theme-toggle-mobile" class="mt-2 w-full px-3 py-2 rounded border text-left theme-toggle" type="button" aria-pressed="false" aria-label="Switch theme"><span class="switch__track" aria-hidden="true"><span class="switch__thumb"></span></span></button>
    </div>
  </header>

  <main class="container safe-pad" id="main-content" style="padding-block:1.25rem 2rem;">
  <!-- Enhanced Projects (projects-pro) Section -->
    <section class="projects-pro" aria-labelledby="pp-heading">
      <h2 id="pp-heading" class="visually-hidden">Projects (Enhanced)</h2>
      <!-- HERO SEARCH -->
      <section class="pp-hero" aria-label="Search projects">
        <div class="pp-hero-inner">
          <input id="pp-search" class="pp-input pp-input-hero" type="search"
                 placeholder="Search projects…" aria-label="Search projects" />
          <button id="pp-search-go" class="pp-btn pp-btn-hero" type="button" aria-label="Run search">Enter</button>
        </div>
      </section>
    <div class="pp-actions" role="region" aria-label="Project controls">
      <select id="pp-sort" class="pp-select" aria-label="Sort projects">
        <option value="newest">Newest</option>
        <option value="oldest">Oldest</option>
        <option value="az">A → Z</option>
      </select>

      <div class="pp-view" role="group" aria-label="View mode">
        <button id="pp-view-grid" class="pp-btn is-active" data-view="grid" aria-pressed="true">Grid</button>
        <button id="pp-view-list" class="pp-btn" data-view="list" aria-pressed="false">List</button>
      </div>
    </div>
    <div id="pp-results" class="pp-grid" role="list" aria-live="polite" aria-busy="true"></div>
    <!-- Card template used by renderer -->
    <template id="pp-card">
      <article class="pp-card" role="listitem" data-project-card>
        <a class="pp-thumb" target="_self" rel="noopener"><img class="pp-thumb-img" alt="" loading="lazy" decoding="async" /></a>
        <div class="pp-body">
          <div class="pp-top">
            <h3 class="pp-title"><a class="pp-link" target="_self" rel="noopener"></a></h3>
            <div class="pp-meta">
              <button class="pp-icon pp-fav" title="Favorite" aria-pressed="false" aria-label="Toggle favorite">
                <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                  <path class="pp-star"
                    d="M12 .587l3.668 7.568L24 9.75l-6 5.854 1.416 8.264L12 19.771l-7.416 4.097L6 15.604 0 9.75l8.332-1.595z" />
                </svg>
              </button>
              <button class="pp-icon pp-share" title="Copy link" aria-label="Copy link">Copy</button>
            </div>
          </div>
          <p class="pp-desc"></p>
          <ul class="pp-tagsline" aria-label="Tags"></ul>
        </div>
      </article>
    </template>

    <!-- inline fallback (keep []) — external JSON is primary -->
    <script type="application/json" id="pp-data">[]</script>

    <section class="projects-cta" aria-label="Assistant">
      <a href="https://chatgpt.com/g/g-6885b0c65ea88191a9727465b8fe4b3e-investigator-gpt"
         class="cta-btn" target="_blank" rel="noopener">
        <img class="cta-ico" src="/assets/icons/b&w-chatgpt-2.svg" alt="" aria-hidden="true">
        <span>Investigator GPT</span>
      </a>
    </section>

    <!-- Renderer moved to external module to avoid TS HTML Problems -->
    <script type="module">
      import initProjectsGallery from "/assets/js/projects-gallery.js?v=proj_ui1";
      initProjectsGallery;
    </script>
  </section>
  <!-- /Enhanced Projects Section -->
  </main>

  <footer
    class="bg-gray-100 dark:bg-slate-950 text-sm text-gray-600 dark:text-slate-400 border-t pt-8 pb-6 px-4 mt-auto">
    <div class="max-w-4xl mx-auto text-center space-y-4">
      <div class="text-navy">© 2025 James Gregory Walsh — All rights reserved.</div>
      <div class="flex justify-center items-center gap-3">
        <a href="mailto:jgwalsh@proton.me"
          class="text-navy hover:underline focus:outline-none focus:ring-2 focus:ring-sage rounded px-1 py-0.5">Email</a>
        <span>·</span>
        <a href="https://github.com/jgwalsh02134" target="_blank" rel="noopener"
          class="inline-flex items-center gap-1 text-navy hover:underline focus:outline-none focus:ring-2 focus:ring-sage rounded px-1 py-0.5"
          aria-label="GitHub profile (opens in new tab)">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path fill-rule="evenodd"

              clip-rule="evenodd" />
          </svg>
          GitHub
        </a>
        <span>·</span>
        <a href="/contact.html"
          class="text-navy hover:underline focus:outline-none focus:ring-2 focus:ring-sage rounded px-1 py-0.5">Contact</a>
      </div>
    </div>
  </footer>
  <script>
  (function navMenu(){
    const btn = document.getElementById('mobile-menu-button');
    const menu = document.getElementById('mobile-menu');
    if(!btn || !menu) return;
    btn.addEventListener('click', () => {
      const open = !menu.classList.toggle('hidden');
      btn.setAttribute('aria-expanded', String(open));
    });
  })();
  </script>
</body>
