<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Projects & Portfolio — James Gregory Walsh</title>
  <meta name="description" content="A selection of projects demonstrating analysis, research, visualization, and psych-tech initiatives.">
  <link rel="canonical" href="/projects/">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="/assets/css/projects.css">
</head>
<body style="background:var(--bg); color:var(--text);">
  <main class="page-wrap" id="projects-app">
    <header class="header" aria-labelledby="title">
      <h1 id="title">Projects & Portfolio</h1>
      <p>A selection of projects demonstrating analysis, research, visualization, and psych-tech initiatives.</p>
    </header>

    <section class="toolbar" aria-label="Project controls">
      <div class="search" role="search">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24"><path fill="currentColor" d="M21 21l-4.2-4.2m1.2-4a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input id="q" type="search" placeholder="Search projects…" autocomplete="off" />
      </div>
      <div class="filters" aria-label="Filters">
        <!-- Pills added by JS from distinct types/tags -->
      </div>
      <div class="sort">
        <label for="sort">Sort</label>
        <select id="sort" aria-label="Sort">
          <option value="featured">Featured</option>
          <option value="newest">Newest</option>
          <option value="oldest">Oldest</option>
          <option value="az">A–Z</option>
        </select>
      </div>
    </section>

    <section class="grid" id="grid" aria-live="polite">
      <article class="card skeleton" aria-hidden="true" style="height:280px;"></article>
      <article class="card skeleton" aria-hidden="true" style="height:280px;"></article>
      <article class="card skeleton" aria-hidden="true" style="height:280px;"></article>
    </section>

    <div class="empty" id="empty" hidden>No results. Try clearing filters.</div>
  </main>

  <script type="module" src="/assets/js/projects.js"></script>
  
  <!-- Enhanced Projects (projects-pro) Section -->
  <section class="projects-pro" aria-labelledby="pp-heading">
    <h2 id="pp-heading" class="visually-hidden">Projects (Enhanced)</h2>
    <div class="pp-controls" role="group" aria-label="Project filters and search">
      <div class="pp-search">
        <input id="pp-search" type="search" placeholder="Search…" autocomplete="off" aria-label="Search projects">
      </div>
      <div class="pp-sort">
        <label for="pp-sort" class="visually-hidden">Sort</label>
        <select id="pp-sort" aria-label="Sort projects">
          <option value="newest" selected>Newest</option>
          <option value="oldest">Oldest</option>
          <option value="az">A–Z</option>
        </select>
      </div>
      <div class="pp-tags" aria-label="Tag filters"></div>
    </div>
    <div id="pp-results" class="pp-grid" role="list" aria-live="polite"></div>

    <!-- Inline dataset fallback (used if external fetch fails) -->
    <script type="application/json" id="pp-data">
[
  { "id": "crime-analysis", "title": "Crime Analysis Report", "url": "/project-crime-analysis.html", "desc": "Albany, NY 2021–2024 interactive brief.", "tags": ["crime","report","dashboard"], "date": "2025-07-20" },
  { "id": "arrest-trends", "title": "Interactive Crime Arrest Trends", "url": "/interactive_crime_arrest_trends.html", "desc": "Explore arrest patterns over time.", "tags": ["crime","visualization","timeseries"], "date": "2025-07-10" },
  { "id": "neighborhood-treemap", "title": "Neighborhood Treemap", "url": "/interactive_neighborhood_treemap.html", "desc": "Incidents by area and category.", "tags": ["crime","geography","visualization"], "date": "2025-07-05" },
  { "id": "violent-sunburst", "title": "Violent Crime Sunburst", "url": "/interactive_violent_crime_sunburst.html", "desc": "Hierarchical view of violent offenses.", "tags": ["crime","visualization","hierarchy"], "date": "2025-06-28" },
  { "id": "sankey-2024", "title": "Case Resolution Sankey (2024)", "url": "/case_resolution_sankey_2024.html", "desc": "Flow from report to outcome.", "tags": ["flow","visualization","process"], "date": "2025-06-20" },
  { "id": "resource-center", "title": "Resource Center", "url": "/resources/", "desc": "Datasets, documents, and references.", "tags": ["resources","docs","data"], "date": "2025-06-01" },
  { "id": "psyber-nexus", "title": "Psyber Nexus", "url": "/projects/psyber-nexus/", "desc": "Applied behavioral + cyber investigations hub.", "tags": ["investigations","behavioral","tools"], "date": "2025-09-02" },
  { "id": "albany-crime-dashboard", "title": "Albany Crime Dashboard", "url": "/projects/albany-crime-dashboard/", "desc": "Interactive crime analytics for the Capital District.", "tags": ["crime","dashboard","albany"], "date": "2025-09-02" },
  { "id": "project-gallery", "title": "Project Gallery", "url": "/projects/gallery/", "desc": "Visual gallery of prototypes and experiments.", "tags": ["gallery","showcase"], "date": "2025-09-02" }
]
    </script>

    <!-- Card template used by renderer -->
    <template id="pp-card">
      <article class="pp-card" role="listitem" data-project-card>
        <a class="pp-thumb" target="_self" rel="noopener"></a>
        <div class="pp-body">
          <div class="pp-top">
            <h3 class="pp-title"><a class="pp-link" target="_self" rel="noopener"></a></h3>
            <div class="pp-meta">
              <button class="pp-icon pp-fav" title="Favorite" aria-pressed="false" aria-label="Toggle favorite">
                <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path class="pp-star" d="M12 .587l3.668 7.568L24 9.75l-6 5.854 1.416 8.264L12 19.771l-7.416 4.097L6 15.604 0 9.75l8.332-1.595z"/></svg>
              </button>
              <button class="pp-icon pp-share" title="Copy link" aria-label="Copy link">Copy</button>
            </div>
          </div>
          <p class="pp-desc"></p>
          <ul class="pp-tagsline" aria-label="Tags"></ul>
        </div>
      </article>
    </template>

    <!-- Renderer: tries external JSON then falls back to inline -->
    <script type="module">
    (async () => {
      const $=(s,e=document)=>e.querySelector(s);
      const list=$('#pp-results'), tpl=$('#pp-card');
      const sortSel=$('#pp-sort'), input=$('#pp-search');
      const chipsWrap=document.querySelector('.pp-tags');
      const FAVORITES_KEY='pp:favorites';

      async function loadExternal() {
        try {
          const res = await fetch('/assets/data/projects.json', { cache: 'no-cache' });
          if (!res.ok) return null;
          const json = await res.json();
          return Array.isArray(json) ? json : null;
        } catch { return null; }
      }
      function loadInline() {
        try { return JSON.parse($('#pp-data').textContent); } catch { return []; }
      }
      function normalize(p){
        // Support both the simple schema and existing richer schema
        return {
          id: p.id,
            title: p.title || p.name || 'Untitled',
            url: p.url || p.links?.primary || p.links?.demo || '#',
            desc: p.desc || p.summary || p.description || '',
            tags: p.tags || [],
            date: p.date || (p.year ? `${p.year}-01-01` : '')
        };
      }
      const external = await loadExternal();
      const raw = (external && external.length) ? external : loadInline();
      const data = raw.map(normalize);

      if (!data.length) {
        list.innerHTML = '<p style="padding:12px;">No projects found. Populate <code>/assets/data/projects.json</code> or the <code>#pp-data</code> block.</p>';
        return;
      }

      const favs=new Set(JSON.parse(localStorage.getItem(FAVORITES_KEY)||'[]'));
      const allTags=[...new Set(data.flatMap(p=>p.tags))].sort();
      const qs=new URLSearchParams(location.search);
      const state={ q: qs.get('q')||'', tags: new Set((qs.get('tags')||'').split(',').filter(Boolean)), sort: qs.get('sort')||'newest', view: qs.get('view')||'grid' };
      if (input) input.value = state.q;

      const favChip = chip('favorites','★ Favorites');
      chipsWrap.append(favChip);
      allTags.forEach(t=>chipsWrap.append(chip(t)));

      function chip(tag,label){
        const c=document.createElement('button'); c.className='pp-chip';
        c.textContent=label||tag; c.dataset.tag=tag;
        if(state.tags.has(tag)) c.classList.add('is-on');
        c.onclick=()=>{ state.tags.has(tag) ? (state.tags.delete(tag), c.classList.remove('is-on')) : (state.tags.add(tag), c.classList.add('is-on')); syncQS(); render(); };
        return c;
      }

      function syncQS(){
        const p=new URLSearchParams();
        if(state.q) p.set('q',state.q);
        if(state.tags.size) p.set('tags',[...state.tags].join(','));
        if(state.sort!=='newest') p.set('sort',state.sort);
        const u=location.pathname+(p.toString()?('?'+p.toString()):'');
        history.replaceState(null,'',u);
      }

      function render(){
        list.setAttribute('aria-busy','true'); list.innerHTML='';
        let rows = data.slice();
        const q = (state.q||'').trim().toLowerCase();
        if (q) rows = rows.filter(p => (p.title+p.desc+p.tags.join(' ')).toLowerCase().includes(q));
        const tags=[...state.tags];
        if (tags.length) {
          const favOn = state.tags.has('favorites');
          rows = rows.filter(p => {
            const hasAll = tags.filter(t=>t!=='favorites').every(t=>p.tags.includes(t));
            return (favOn ? favs.has(p.id) : true) && (tags.some(t=>t!=='favorites') ? hasAll : true);
          });
        }
        if (state.sort === 'az') rows.sort((a,b)=>a.title.localeCompare(b.title));
        else if (state.sort === 'oldest') rows.sort((a,b)=> (a.date||'').localeCompare(b.date||''));
        else rows.sort((a,b)=> (b.date||'').localeCompare(a.date||''));
        if (!rows.length) {
          list.innerHTML = '<p style="padding:12px;">No matches. Clear filters or search.</p>';
          list.setAttribute('aria-busy','false');
          return;
        }
        for (const p of rows) {
          const n = tpl.content.firstElementChild.cloneNode(true);
          const link = n.querySelector('.pp-link'), th = n.querySelector('.pp-thumb'), ds = n.querySelector('.pp-desc'), tl = n.querySelector('.pp-tagsline');
          const favBtn = n.querySelector('.pp-fav'), share = n.querySelector('.pp-share');
          link.href=p.url; link.textContent=p.title; th.href=p.url; ds.textContent=p.desc;
          p.tags.forEach(t=>{ const li=document.createElement('li'); li.className='pp-tag'; li.textContent=t; tl.appendChild(li); });
          favBtn.setAttribute('aria-pressed',favs.has(p.id)?'true':'false');
          if (favs.has(p.id)) n.classList.add('is-fav');
          favBtn.onclick=()=>{ favs.has(p.id) ? favs.delete(p.id) : favs.add(p.id); localStorage.setItem(FAVORITES_KEY,JSON.stringify([...favs])); render(); };
          share.onclick=async()=>{ try{ const u=new URL(p.url,location.origin); u.hash=p.id; await navigator.clipboard.writeText(u.toString()); share.textContent='Copied'; setTimeout(()=>share.textContent='Copy',1200);}catch{} };
          list.appendChild(n);
        }
        list.className = 'pp-grid';
        list.setAttribute('aria-busy','false');
      }
      if (sortSel) sortSel.onchange = e => { state.sort = e.target.value; syncQS(); render(); };
      if (input) input.oninput = e => { state.q = e.target.value; syncQS(); render(); };
      render();
    })();
    </script>
  </section>
  <!-- /Enhanced Projects Section -->
</body>

</html>
