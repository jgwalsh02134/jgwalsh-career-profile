<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secure Notes – J. Gregory Walsh</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8f9fa;
    }
    .font-serif {
      font-family: 'DM Serif Display', serif;
    }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
  <script>
    function parseJwtPayload(jwt) {
      try {
        const payload = jwt.split('.')[1];
        const decoded = atob(payload.replace(/-/g, '+').replace(/_/g, '/'));
        return JSON.parse(decoded);
      } catch { return null; }
    }

    function setUser() {
      const jwt = document.cookie.split('; ').find(row => row.startsWith('CF_Authorization='))?.split('=')[1];
      if (!jwt) return;
      const payload = parseJwtPayload(jwt);
      document.getElementById('userEmail').textContent = payload?.email || 'Authenticated user';
    }

    async function fetchNotes() {
      const res = await fetch('/api/notes');
      const notes = await res.json();
      const container = document.getElementById('notesList');
      container.innerHTML = '';
      notes.forEach(note => {
        const card = document.createElement('div');
        card.className = 'bg-white border border-slate-300 p-4 rounded shadow-sm';
        card.innerHTML = `<h3 class="font-serif font-semibold text-slate-800 mb-1">${note.title}</h3><pre class="text-sm text-slate-700">${note.body}</pre>`;
        container.appendChild(card);
      });
    }

    async function submitNote(e) {
      e.preventDefault();
      const title = document.getElementById('noteTitle').value.trim();
      const body = document.getElementById('noteBody').value.trim();
      if (!title || !body) return;

      await fetch('/api/notes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, body })
      });

      document.getElementById('noteTitle').value = '';
      document.getElementById('noteBody').value = '';
      fetchNotes();
    }

    document.addEventListener('DOMContentLoaded', () => {
      setUser();
      fetchNotes();
      document.getElementById('noteForm').addEventListener('submit', submitNote);
    });
  </script>
</head>
<body class="text-slate-800">
  <div class="max-w-3xl mx-auto px-6 py-10">
    <header class="mb-8">
      <h1 class="text-3xl font-serif font-bold text-slate-900 mb-2">Secure Notes</h1>
      <p class="text-sm text-slate-700">Access granted to <code id="userEmail">...</code></p>
    </header>

    <main>
      <section class="bg-white border border-slate-200 rounded-lg p-6 shadow-sm mb-8">
        <h2 class="text-lg font-semibold font-serif mb-4 text-slate-800">New Note</h2>
        <form id="noteForm" class="space-y-4">
          <input type="text" id="noteTitle" placeholder="Title" class="w-full border border-slate-300 rounded p-2 text-sm text-slate-800" />
          <textarea id="noteBody" placeholder="Body..." class="w-full border border-slate-300 rounded p-3 text-sm font-mono text-slate-800 h-40"></textarea>
          <button type="submit" class="bg-slate-800 text-white px-4 py-2 rounded hover:bg-slate-900 text-sm">Save Note</button>
        </form>
        <p class="mt-3 text-xs text-slate-500">Notes are saved to secure Cloudflare KV storage. Session required.</p>
      </section>

      <section id="notesList" class="space-y-4">
        <!-- Notes will populate here -->
      </section>

      <section class="text-sm text-slate-600 border-t pt-6">
        <a href="/private/index.html" class="text-blue-700 hover:underline font-medium">&larr; Return to dashboard</a>
      </section>
    </main>
  </div>
</body>
</html>
